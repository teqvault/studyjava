*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.62}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) 1fr}.sidebar{position:sticky;top:0;height:100vh;padding:22px 18px;background:linear-gradient(180deg,var(--panel),var(--bg));border-right:1px solid var(--line);overflow:auto;z-index:20}.brand{display:flex;gap:12px;align-items:center;padding:8px 8px 18px}.brand-mark{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;font-weight:900;color:#07101f;background:linear-gradient(135deg,var(--accent),#ffe4a3);box-shadow:0 8px 25px rgba(244,185,66,.22)}.brand h1{font-size:15px;line-height:1.25;margin:0}.brand small{color:var(--muted)}.sidebar-progress{padding:14px;border:1px solid var(--line);background:var(--panel2);border-radius:15px;margin-bottom:15px}.progress-row{display:flex;justify-content:space-between;gap:10px;font-size:13px}.progress-track{height:8px;background:rgba(127,145,170,.22);border-radius:99px;overflow:hidden;margin-top:9px}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s}.nav-group{margin:18px 0 8px;padding:0 9px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.nav-btn{width:100%;border:0;color:var(--muted);background:transparent;text-align:left;padding:10px 12px;border-radius:11px;display:flex;gap:10px;align-items:flex-start}.nav-btn:hover,.nav-btn.active{color:var(--text);background:var(--panel2)}.nav-btn.active{box-shadow:inset 3px 0 var(--accent)}.nav-num{font-size:11px;min-width:25px;margin-top:2px;color:var(--accent)}.sidebar-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.icon-btn,.secondary,.primary,.danger{border:1px solid var(--line);border-radius:11px;padding:10px 13px;color:var(--text);background:var(--panel2)}.primary{background:linear-gradient(135deg,var(--accent),#ffd882);color:#111827;border:0;font-weight:800}.secondary:hover,.icon-btn:hover{border-color:var(--accent)}.danger{color:#fff;background:var(--danger);border:0}.main{min-width:0}.topbar{position:sticky;top:0;z-index:10;display:flex;gap:12px;align-items:center;padding:14px 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.menu-btn{display:none}.search{flex:1;position:relative}.search input{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:10px 14px 10px 40px;outline:none}.search span{position:absolute;left:14px;top:9px;color:var(--muted)}.top-stats{font-size:13px;color:var(--muted)}.content{max-width:1180px;margin:0 auto;padding:30px}.hero{padding:30px;border-radius:24px;border:1px solid var(--line);background:radial-gradient(circle at 85% 15%,rgba(79,209,197,.18),transparent 32%),radial-gradient(circle at 10% 10%,rgba(244,185,66,.18),transparent 30%),var(--panel);box-shadow:var(--shadow)}.eyebrow{color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.hero h2{font-size:clamp(31px,5vw,58px);line-height:1.04;margin:10px 0 13px;max-width:850px}.hero p{max-width:780px;color:var(--muted);font-size:17px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.grid{display:grid;gap:18px}.stats-grid{grid-template-columns:repeat(4,1fr);margin:20px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:21px;box-shadow:0 10px 30px rgba(0,0,0,.08)}.stat strong{display:block;font-size:30px}.stat span{color:var(--muted);font-size:13px}.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:32px 0 14px}.section-title h3{margin:0;font-size:24px}.section-title p{margin:0;color:var(--muted)}.week-grid{grid-template-columns:repeat(3,1fr)}.week-card strong{color:var(--accent)}.week-card p{color:var(--muted);margin-bottom:0}.module-head{display:flex;justify-content:space-between;gap:22px;align-items:flex-start}.module-head h2{font-size:38px;line-height:1.1;margin:8px 0}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:12px}.badge.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}.objectives{grid-template-columns:repeat(2,1fr);margin:20px 0}.objective{display:flex;gap:10px;align-items:flex-start}.tick{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:rgba(101,214,138,.14);color:var(--ok);font-weight:900;flex:0 0 auto}.lesson-section{margin:18px 0}.lesson-section h3{font-size:21px;margin-top:0}.lesson-section p{color:var(--muted)}.lesson-section li{margin:7px 0;color:var(--muted)}pre{background:#050b14;color:#dbeafe;border:1px solid #1d2d47;border-radius:14px;padding:16px;overflow:auto;line-height:1.5}code{font-family:"Cascadia Code",Consolas,monospace}.callout{padding:15px 17px;border-left:4px solid var(--accent);background:rgba(244,185,66,.08);border-radius:10px;margin:15px 0}.interviewer{border-left:4px solid var(--accent2);background:rgba(79,209,197,.08)}.module-actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.notes textarea,.star-grid textarea,.scratchpad{width:100%;min-height:130px;resize:vertical;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px;outline:none}.quiz-shell{max-width:820px}.quiz-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.quiz-question{font-size:24px;line-height:1.35;margin:20px 0}.choices{display:grid;gap:10px}.choice{border:1px solid var(--line);background:var(--panel2);color:var(--text);text-align:left;padding:14px;border-radius:12px}.choice:hover{border-color:var(--accent)}.choice.correct{border-color:var(--ok);background:rgba(101,214,138,.12)}.choice.wrong{border-color:var(--danger);background:rgba(255,107,107,.12)}.explanation{margin-top:15px;padding:14px;border-radius:12px;background:var(--panel2);color:var(--muted)}.lab-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.lab-list{grid-template-columns:repeat(3,1fr)}.lab-card{display:flex;flex-direction:column}.lab-card h3{margin:7px 0}.lab-card p{color:var(--muted);flex:1}.lab-detail h2{font-size:38px;margin-bottom:8px}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);font-size:12px}.hint{display:none;margin:10px 0;padding:12px;background:rgba(244,185,66,.08);border-radius:10px}.solution-box{display:none}.solution-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.solution-tab{padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}.solution-tab.active{color:var(--text);border-color:var(--accent)}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.filters select,.filters input,.star-select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px}.question-bank{display:grid;gap:10px}.qa{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}.qa button{width:100%;padding:15px;text-align:left;border:0;background:transparent;color:var(--text);display:flex;justify-content:space-between;gap:15px}.qa-answer{display:none;padding:0 15px 15px;color:var(--muted)}.qa.open .qa-answer{display:block}.star-grid{grid-template-columns:repeat(2,1fr)}.star-card label{display:block;font-weight:800;margin-bottom:8px}.star-preview{white-space:pre-wrap;color:var(--muted)}.mock-grid{grid-template-columns:1.15fr .85fr}.timer{font-size:64px;font-weight:900;letter-spacing:.04em}.timer-controls{display:flex;gap:8px;flex-wrap:wrap}.prompt-box{font-size:25px;line-height:1.4;min-height:150px;padding:22px;border-radius:15px;background:var(--panel2);display:flex;align-items:center}.rubric-row{display:grid;grid-template-columns:1fr 170px 35px;gap:12px;align-items:center;margin:12px 0}.rubric-row input{width:100%}.readiness-grid{grid-template-columns:repeat(2,1fr)}.check-item{display:flex;gap:10px;padding:11px;border-radius:11px;background:var(--panel2)}.check-item input{width:18px}.toast{position:fixed;right:22px;bottom:22px;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:800;transform:translateY(140%);transition:.25s;z-index:100}.toast.show{transform:translateY(0)}.footer{padding:30px;color:var(--muted);text-align:center}.empty{padding:50px;text-align:center;color:var(--muted)}

<script>
const COURSE = {"modules": [{"id": "interview-foundations", "phase": "Phase 1 · Interview Foundations", "title": "1. Interview Mindset & Process", "duration": "60–90 min", "level": "Foundation", "objectives": ["Understand a modern engineering interview loop", "Separate signal from trivia", "Use a repeatable communication framework", "Recognize junior-level expectations"], "sections": [["What interviewers are measuring", "<p>Strong interviews are not silent exams. Interviewers are collecting evidence that you can understand ambiguity, choose sensible tradeoffs, write maintainable code, test your work, and collaborate under pressure.</p><div class=\"callout\"><strong>The hiring signal:</strong> “Would I trust this person to work through an unfamiliar problem with the team?”</div>"], ["The CLEAR framework", "<ol><li><strong>Clarify:</strong> restate the problem and constraints.</li><li><strong>List:</strong> name the straightforward and optimized approaches.</li><li><strong>Explain:</strong> walk through an example before coding.</li><li><strong>Apply:</strong> implement clean, testable code.</li><li><strong>Review:</strong> test edge cases and analyze complexity.</li></ol>"], ["What junior candidates should demonstrate", "<p>You are not expected to know every framework. You are expected to show solid fundamentals, intellectual honesty, coachability, and a habit of validating your assumptions. Saying “I’m not certain, but here is how I would verify it” is often stronger than bluffing.</p>"]], "interviewer": "I reward candidates who make their reasoning easy to follow. I do not reward theatrical confidence when the logic is weak.", "exercise": "Record a two-minute answer to “Tell me about yourself.” Remove biography that does not support your engineering story.", "quiz": [["What is the best first action after receiving an ambiguous coding problem?", ["Start coding immediately", "Ask focused clarifying questions", "Choose the fastest language", "Explain every data structure you know"], 1, "Clarification prevents solving the wrong problem and reveals important constraints."], ["Which behavior creates the strongest junior-level signal?", ["Pretending to know every answer", "Using the most advanced algorithm", "Testing assumptions and accepting feedback", "Finishing without speaking"], 2, "Coachability, testing, and clear reasoning are stronger signals than performance theater."], ["In CLEAR, what happens before implementation?", ["Review", "Explain the approach", "Optimize prematurely", "Discuss salary"], 1, "You should explain the chosen approach and walk through an example before coding."], ["What should you do when you do not remember an API?", ["Invent it confidently", "Stop the interview", "State the uncertainty and describe how you would verify it", "Change the question"], 2, "Honest uncertainty paired with a verification plan demonstrates professional judgment."], ["What is the interviewer ultimately trying to predict?", ["Typing speed", "Whether you memorized the same question", "Future job performance on a team", "How many languages you list"], 2, "The interview is an imperfect attempt to predict how you will perform in the role."]]}, {"id": "programming-foundations", "phase": "Phase 1 · Interview Foundations", "title": "2. Programming & Memory Fundamentals", "duration": "2–3 hr", "level": "Foundation", "objectives": ["Explain values, references, mutability, and scope", "Reason about memory and object lifetime", "Compare static and dynamic typing", "Handle nullability and errors safely"], "sections": [["Values, references, and mutation", "<p>A variable may contain a value directly or a reference to an object. Passing a reference-like value still usually passes the reference <em>by value</em>. Reassigning the local parameter does not replace the caller’s variable, but mutating the shared object can affect the caller.</p><pre><code>items = [1, 2]\nchange(items)   # mutation may be visible\nreplace(items)  # local reassignment usually is not</code></pre>"], ["Stack, heap, and lifetime", "<p>The call stack stores active function frames and local execution state. Heap storage supports objects whose lifetime is not tied to one stack frame. Managed runtimes reclaim unreachable objects; C++ and Rust make lifetime and ownership more explicit.</p>"], ["Types and nullability", "<p>Static type systems catch classes of errors before runtime. Dynamic languages trade some compile-time guarantees for flexibility. In both cases, robust code makes absence explicit through validation, optional types, or result objects rather than allowing uncontrolled null failures.</p>"], ["Error models", "<p>Exceptions are useful for exceptional failure paths. Result types make expected failure explicit. Good APIs distinguish validation errors, transient infrastructure errors, authorization errors, and programmer defects.</p>"]], "interviewer": "Do not recite “stack fast, heap slow” as an absolute. Explain purpose, lifetime, allocation, and language/runtime behavior.", "exercise": "Explain what happens when a mutable object is passed into a function, modified, and then the local parameter is reassigned.", "quiz": [["What is usually copied when an object reference is passed to a function?", ["The entire object", "The reference value", "The heap", "The class definition"], 1, "Most mainstream languages pass the reference value; both caller and callee may refer to the same object."], ["What is mutability?", ["The ability to execute code", "The ability of an existing value or object to change", "The use of static types", "The lifetime of a stack frame"], 1, "Mutable objects can change after creation; immutable values cannot."], ["Which is an expected-recovery error model?", ["Result/Option type", "Undefined behavior", "Process crash", "Memory corruption"], 0, "Result-like types explicitly represent success or expected failure."], ["What does a garbage collector generally reclaim?", ["Every old object", "Objects no longer reachable from program roots", "All stack frames", "Only strings"], 1, "Reachability is the key concept in common tracing garbage collectors."], ["Why make nullability explicit?", ["To increase file size", "To communicate absence and force handling", "To avoid functions", "To disable testing"], 1, "Explicit nullability helps both humans and tools reason about missing values."]]}, {"id": "complexity", "phase": "Phase 2 · Algorithms", "title": "3. Complexity Analysis", "duration": "2 hr", "level": "Core", "objectives": ["Compute time and space complexity", "Recognize dominant terms", "Understand amortized analysis", "Compare tradeoffs rather than chasing Big O alone"], "sections": [["Growth rates", "<p>Complexity describes how resource use grows with input size. Common classes are O(1), O(log n), O(n), O(n log n), O(n²), and exponential. Drop constants and lower-order terms when discussing asymptotic growth.</p>"], ["Loops and recursion", "<p>Sequential loops add; nested dependent work often multiplies. Recursive complexity requires considering the branching factor, recursion depth, and work per call.</p><pre><code>for i in range(n):        # O(n)\n  for j in range(n):      # O(n²)\n    use(i, j)</code></pre>"], ["Amortized analysis", "<p>An individual dynamic-array append may trigger an O(n) resize, but over many appends the average cost is O(1) amortized because resizing happens infrequently.</p>"], ["Beyond Big O", "<p>Input size, cache locality, allocations, network calls, database indexes, and implementation complexity matter. O(n) with a tiny constant can beat O(log n) for small data.</p>"]], "interviewer": "I expect you to state complexity after the code works, then identify the operations that justify the answer.", "exercise": "Analyze a function that sorts an array and then scans it once. Explain why O(n log n + n) simplifies to O(n log n).", "quiz": [["What is the complexity of binary search on a sorted array?", ["O(1)", "O(log n)", "O(n)", "O(n log n)"], 1, "The search interval is halved each step."], ["Two consecutive full scans of n items are usually:", ["O(n²)", "O(2n), simplified to O(n)", "O(log n)", "O(1)"], 1, "Sequential work adds; constants are dropped asymptotically."], ["Why is dynamic-array append often O(1) amortized?", ["It never resizes", "Expensive resizes are spread across many cheap appends", "Arrays are linked lists", "Memory is unlimited"], 1, "Occasional O(n) copies are averaged over many constant-time appends."], ["What often dominates O(n log n + n)?", ["O(n)", "O(log n)", "O(n log n)", "O(1)"], 2, "The faster-growing term dominates for large n."], ["Which statement is most accurate?", ["Big O completely predicts speed", "Big O is useless", "Big O describes growth, while constants and systems effects still matter", "Only space complexity matters"], 2, "Complexity is essential but not the only performance factor."]]}, {"id": "arrays-strings", "phase": "Phase 2 · Algorithms", "title": "4. Arrays & Strings", "duration": "3 hr", "level": "Core", "objectives": ["Use indexing and prefix techniques", "Handle string immutability", "Recognize two-pointer patterns", "Avoid off-by-one errors"], "sections": [["Array strengths", "<p>Arrays provide O(1) indexed access and excellent locality. Insertions in the middle are usually O(n) because later elements shift.</p>"], ["Two pointers", "<p>Use two pointers when scanning sorted input, comparing ends, compacting in place, or maintaining a pair relationship. State the invariant: what remains true before and after each pointer movement.</p>"], ["Prefix sums", "<p>A prefix array converts repeated range-sum queries from O(n) each to O(1) after O(n) preprocessing.</p><pre><code>prefix[i + 1] = prefix[i] + nums[i]\nrange_sum(l, r) = prefix[r + 1] - prefix[l]</code></pre>"], ["String construction", "<p>Repeated immutable-string concatenation can become quadratic. Use a builder, list of pieces, or buffer when constructing large output.</p>"]], "interviewer": "For array questions, I listen for bounds, empty input, duplicates, and whether in-place mutation is allowed.", "exercise": "Implement “move zeroes to the end” in place while preserving nonzero order. Explain the write-pointer invariant.", "quiz": [["What is typical indexed access complexity for an array?", ["O(1)", "O(log n)", "O(n)", "O(n²)"], 0, "The address can be computed directly from the base and index."], ["When is a two-pointer technique especially useful?", ["Random graph traversal", "Pair relationships in sorted or linear data", "Compiling code", "Database normalization"], 1, "Two pointers reduce repeated scanning when the structure supports coordinated movement."], ["What does a prefix sum optimize?", ["Repeated range-sum queries", "Sorting", "Hash collisions", "Thread scheduling"], 0, "Precomputation enables constant-time range sums."], ["What commonly causes off-by-one errors?", ["Clear interval conventions", "Mixing inclusive and exclusive bounds", "Using tests", "Naming variables"], 1, "Choose and state one interval convention, such as [left, right)."], ["Why can repeated immutable-string concatenation be expensive?", ["Strings are always encrypted", "Each concatenation may copy accumulated content", "Strings use graphs", "It disables the CPU cache"], 1, "Repeated copying can produce quadratic total work."]]}, {"id": "hashing-windows", "phase": "Phase 2 · Algorithms", "title": "5. Hashing, Two Pointers & Sliding Windows", "duration": "3 hr", "level": "Core", "objectives": ["Use sets and maps for fast membership", "Distinguish fixed and variable windows", "Track window invariants", "Discuss hash-table worst cases"], "sections": [["Hash maps and sets", "<p>Hash tables offer average O(1) insertion, lookup, and deletion. They are ideal for counts, membership, grouping, and mapping values to positions.</p>"], ["Sliding windows", "<p>A window represents a contiguous region. Fixed windows move with constant size. Variable windows expand until invalid, then shrink until the invariant is restored.</p>"], ["Canonical pattern", "<pre><code>left = 0\nfor right in range(len(data)):\n    add(data[right])\n    while window_is_invalid():\n        remove(data[left])\n        left += 1\n    update_answer(left, right)</code></pre>"], ["Collision realism", "<p>Hash operations are average O(1), not magically guaranteed. Poor hashing or adversarial input can degrade performance. Language runtimes use collision strategies and defensive measures.</p>"]], "interviewer": "Say exactly what makes the current window valid. If you cannot state the invariant, the code will drift.", "exercise": "Solve “longest substring without repeating characters” and explain why the left pointer never moves backward.", "quiz": [["A set is most useful when you need:", ["Ordered duplicates", "Fast membership checks", "Recursive calls", "File compression"], 1, "Sets model uniqueness and membership."], ["What distinguishes a variable sliding window?", ["Its size changes to maintain a condition", "It requires sorting", "It uses recursion only", "It cannot move left"], 0, "The window expands and contracts while preserving an invariant."], ["Average hash-table lookup complexity is:", ["O(1)", "O(log n)", "O(n log n)", "O(2ⁿ)"], 0, "With a good hash distribution, lookup is expected constant time."], ["In a valid-window algorithm, why does the left pointer move?", ["To make the code longer", "To restore the window invariant", "To sort the input", "To allocate memory"], 1, "Shrinking removes elements until the condition becomes valid again."], ["What should be stored for “two sum” in one pass?", ["Only the current index", "Previously seen value-to-index mappings", "A sorted tree of strings", "Every possible pair"], 1, "The map lets you check whether the complement has already appeared."]]}, {"id": "linear-structures", "phase": "Phase 2 · Algorithms", "title": "6. Linked Lists, Stacks & Queues", "duration": "3 hr", "level": "Core", "objectives": ["Manipulate pointer-based structures safely", "Use sentinel nodes", "Recognize stack/queue applications", "Apply fast and slow pointers"], "sections": [["Linked lists", "<p>Linked lists provide O(1) insertion or deletion when the relevant node is already known, but O(n) indexed access. Most bugs come from losing the next pointer or mishandling the head.</p>"], ["Sentinel nodes", "<p>A dummy head removes special cases for inserting or deleting at the beginning. The sentinel is not part of the logical data; it simplifies pointer updates.</p>"], ["Stacks", "<p>Stacks support last-in, first-out behavior. Use them for nested structure validation, undo, expression evaluation, DFS, and monotonic-stack problems.</p>"], ["Queues", "<p>Queues support first-in, first-out behavior. Use them for BFS, scheduling, buffering, and producer-consumer workflows.</p>"]], "interviewer": "When reversing a list, narrate the three pointers: previous, current, and saved next. That prevents pointer loss.", "exercise": "Reverse a singly linked list iteratively and test empty, one-node, and multi-node lists.", "quiz": [["What is typical indexed access complexity in a singly linked list?", ["O(1)", "O(log n)", "O(n)", "O(n²)"], 2, "Nodes must be traversed from the head."], ["Why use a sentinel node?", ["To store every value twice", "To reduce head-specific edge cases", "To sort automatically", "To make traversal recursive"], 1, "A dummy node unifies updates at the head with updates elsewhere."], ["Which structure naturally supports BFS?", ["Stack", "Queue", "Heap only", "Hash function"], 1, "BFS processes nodes level by level in FIFO order."], ["Which structure is commonly used for balanced-parentheses validation?", ["Queue", "Stack", "Graph", "Bloom filter"], 1, "Open delimiters are matched in reverse order."], ["What can fast and slow pointers detect?", ["SQL injection", "A cycle in a linked list", "Compile errors", "Hash collisions only"], 1, "If a cycle exists, a faster pointer eventually meets the slower pointer."]]}, {"id": "search-sort-intervals", "phase": "Phase 2 · Algorithms", "title": "7. Search, Sort & Intervals", "duration": "3 hr", "level": "Core", "objectives": ["Write correct binary search", "Choose sorting strategies", "Merge overlapping intervals", "Reason with invariants"], "sections": [["Binary search", "<p>Binary search applies whenever a monotonic condition divides the search space. It is not limited to searching an exact value in an array; it can search for a minimum feasible answer.</p>"], ["Boundary discipline", "<p>Use a consistent interval, such as <code>[left, right)</code>. State what remains possible inside the interval after each update.</p>"], ["Sorting tradeoffs", "<p>Comparison sorting has an O(n log n) lower bound in the general case. Stable sorting preserves the relative order of equal keys. In-place sorting saves memory but can complicate code.</p>"], ["Intervals", "<p>Sort intervals by start time. Then compare each interval with the last merged interval. Overlap logic depends on whether touching endpoints count as overlap.</p>"]], "interviewer": "Most binary-search failures are boundary failures, not algorithm failures. Write the invariant before the loop.", "exercise": "Implement lower bound: the first index whose value is greater than or equal to a target.", "quiz": [["Binary search requires:", ["Randomness", "A monotonic decision condition", "A linked list", "A hash collision"], 1, "The search space must be divisible based on a monotonic predicate."], ["What is a stable sort?", ["A sort that never crashes", "A sort preserving equal-key relative order", "A sort using no memory", "A sort with O(1) time"], 1, "Stability matters when records have multiple sort keys."], ["The general comparison-sorting lower bound is:", ["O(1)", "O(log n)", "O(n)", "O(n log n)"], 3, "Decision-tree analysis yields the lower bound."], ["What is the first step for merging arbitrary intervals efficiently?", ["Reverse them", "Sort by start time", "Hash every endpoint", "Use BFS"], 1, "Sorting lets overlapping intervals become adjacent."], ["What is a common binary-search loop bug?", ["Too many comments", "Failure to shrink the search interval", "Using integers", "Returning a value"], 1, "Every iteration must remove at least one candidate region."]]}, {"id": "trees-heaps", "phase": "Phase 2 · Algorithms", "title": "8. Trees, BSTs, Tries & Heaps", "duration": "4 hr", "level": "Core", "objectives": ["Traverse trees recursively and iteratively", "Use BST ordering", "Recognize heap use cases", "Understand tries for prefix operations"], "sections": [["Tree traversal", "<p>Depth-first traversal appears as preorder, inorder, and postorder. Breadth-first traversal uses a queue. Choose traversal order based on when a node should be processed relative to its children.</p>"], ["Binary-search trees", "<p>A valid BST imposes bounds on entire subtrees, not just parent-child comparisons. Balanced BST operations are O(log n); a skewed tree degrades to O(n).</p>"], ["Heaps", "<p>A heap efficiently returns the minimum or maximum priority item. Insertion and removal are O(log n), while peeking is O(1). Heaps are ideal for top-k, scheduling, and streaming order statistics.</p>"], ["Tries", "<p>A trie stores strings by shared prefixes. Search complexity depends primarily on key length rather than the number of stored keys, at the cost of memory.</p>"]], "interviewer": "For recursive tree solutions, define precisely what each function returns. That statement often is the solution.", "exercise": "Validate a BST using lower and upper bounds passed through recursion.", "quiz": [["Which traversal of a BST yields sorted order?", ["Preorder", "Inorder", "Postorder", "Level order"], 1, "Inorder visits left subtree, node, then right subtree."], ["Heap peek complexity is typically:", ["O(1)", "O(log n)", "O(n)", "O(n²)"], 0, "The highest-priority element is stored at the root."], ["Why can BST operations degrade to O(n)?", ["The root is too small", "The tree becomes unbalanced and chain-like", "It uses recursion", "Keys are integers"], 1, "Height controls operation cost."], ["A trie is especially useful for:", ["Prefix search and autocomplete", "Matrix multiplication", "Thread locking", "Image compression"], 0, "Shared prefixes are represented directly in the structure."], ["What structure supports level-order traversal?", ["Stack", "Queue", "Set only", "Call stack only"], 1, "FIFO order processes each level before the next."]]}, {"id": "graphs", "phase": "Phase 2 · Algorithms", "title": "9. Graphs & Union-Find", "duration": "4 hr", "level": "Core", "objectives": ["Model graphs with adjacency lists", "Use BFS and DFS", "Detect cycles and components", "Apply topological sort and union-find"], "sections": [["Graph modeling", "<p>Graphs model entities and relationships. An adjacency list is usually space-efficient for sparse graphs. Clarify directed versus undirected, weighted versus unweighted, and whether cycles are possible.</p>"], ["BFS and DFS", "<p>BFS finds shortest paths in unweighted graphs. DFS is natural for components, cycle detection, exhaustive traversal, and recursive structure.</p>"], ["Topological sorting", "<p>A topological order exists only for directed acyclic graphs. Kahn’s algorithm repeatedly removes zero-indegree nodes; DFS can also produce an order while detecting cycles.</p>"], ["Union-find", "<p>Disjoint-set union tracks connected components under repeated merges. Path compression and union by rank make operations nearly constant amortized time.</p>"]], "interviewer": "Always ask whether the graph is directed and whether edges are weighted. Those two answers change the algorithm.", "exercise": "Given course prerequisites, return whether all courses can be completed. Use cycle detection or topological sorting.", "quiz": [["Which algorithm finds shortest paths in an unweighted graph?", ["DFS only", "BFS", "Heap sort", "Binary search"], 1, "BFS discovers nodes in increasing edge distance."], ["A topological order exists for:", ["Every graph", "Only directed acyclic graphs", "Only complete graphs", "Only trees"], 1, "Cycles make dependency ordering impossible."], ["An adjacency list is usually preferred for:", ["Sparse graphs", "No vertices", "Only matrices", "Constant-size graphs only"], 0, "It stores existing edges rather than all possible pairs."], ["Union-find is ideal for:", ["Parsing JSON", "Dynamic connectivity and component merging", "Rendering CSS", "Sorting strings"], 1, "It efficiently answers whether items are in the same connected component."], ["Graph traversal complexity with adjacency lists is:", ["O(1)", "O(log V)", "O(V + E)", "O(V × E) always"], 2, "Each vertex and edge is processed a constant number of times."]]}, {"id": "recursion-dp", "phase": "Phase 2 · Algorithms", "title": "10. Recursion, Backtracking & Dynamic Programming", "duration": "5 hr", "level": "Advanced Core", "objectives": ["Define recursive state and base cases", "Prune backtracking searches", "Recognize overlapping subproblems", "Build memoized and tabulated solutions"], "sections": [["Recursion", "<p>A recursive function needs a shrinking problem, correct base cases, and a clear return contract. Trace small examples before coding.</p>"], ["Backtracking", "<p>Backtracking explores choices, abandons invalid partial solutions, and undoes state. The template is choose, explore, and unchoose.</p>"], ["Dynamic programming", "<p>DP applies when subproblems overlap and the optimal solution can be composed from optimal subsolutions. Define the state, transition, base cases, evaluation order, and final answer.</p>"], ["Memoization vs tabulation", "<p>Memoization is top-down and computes reachable states on demand. Tabulation is bottom-up and can offer predictable iteration and lower recursion overhead.</p>"]], "interviewer": "Do not start with a DP table. First say what one state means in a complete sentence.", "exercise": "Solve coin change. Define dp[x] as the minimum number of coins needed to form amount x.", "quiz": [["What must every recursive solution include?", ["A database", "A base case and progress toward it", "A queue", "A class"], 1, "Without termination and progress, recursion does not end correctly."], ["Backtracking follows which cycle?", ["Sort, hash, compile", "Choose, explore, unchoose", "Read, write, delete", "Push, wait, crash"], 1, "Undoing state allows the search to try another branch."], ["DP is most appropriate when there are:", ["No subproblems", "Overlapping subproblems and composable optimal structure", "Only strings", "Only constant inputs"], 1, "Those properties enable reuse of solved states."], ["Memoization is:", ["Bottom-up only", "Top-down caching of function results", "A sorting algorithm", "A network protocol"], 1, "Memoization stores computed recursive states."], ["The first DP design question should be:", ["Which color should the table be?", "What does the state represent?", "Can I use a framework?", "How many comments are required?"], 1, "A precise state definition determines transitions and base cases."]]}, {"id": "sql-databases", "phase": "Phase 3 · Practical Engineering", "title": "11. SQL & Database Engineering", "duration": "5 hr", "level": "Core", "objectives": ["Write joins, aggregates, CTEs, and windows", "Design normalized schemas", "Explain indexes and transactions", "Choose relational versus NoSQL storage"], "sections": [["Query fluency", "<p>Master filtering, joins, grouping, subqueries, CTEs, and window functions. Interview SQL often tests whether you preserve rows correctly and understand duplicate behavior.</p>"], ["Indexes", "<p>An index trades storage and write cost for faster reads. Composite index order matters. An index can support filtering, joining, ordering, and covering queries, but not every query benefits.</p>"], ["Transactions", "<p>Transactions provide atomicity, consistency, isolation, and durability. Isolation levels balance concurrency against anomalies such as dirty reads, non-repeatable reads, and phantoms.</p>"], ["Modeling", "<p>Normalization reduces duplication and update anomalies. Denormalization may improve reads at the cost of synchronization complexity. Use constraints to enforce invariants close to the data.</p>"]], "interviewer": "Before writing SQL, state the desired result grain: one row per user, order, day, or category.", "exercise": "Write a query returning each customer’s latest order and total lifetime spend.", "quiz": [["What does a LEFT JOIN preserve?", ["Only matching right rows", "All left rows, with nulls for missing matches", "Only duplicates", "No rows"], 1, "The left relation is preserved even without a match."], ["Why can an index slow writes?", ["It disables memory", "The index must also be maintained", "It removes constraints", "It converts SQL to JSON"], 1, "Insert, update, and delete operations may update multiple index structures."], ["What does DENSE_RANK do with ties?", ["Assigns unique random numbers", "Gives equal values the same rank without gaps afterward", "Deletes ties", "Returns booleans"], 1, "DENSE_RANK is useful for nth distinct-value problems."], ["Atomicity means:", ["Queries are always fast", "A transaction completes entirely or not at all", "Every table has one column", "Data is encrypted"], 1, "Partial transaction effects are not committed."], ["Normalization primarily reduces:", ["CPU instructions", "Data duplication and update anomalies", "Network ports", "Source control conflicts"], 1, "Normalized structure improves consistency and integrity."]]}, {"id": "web-backend", "phase": "Phase 3 · Practical Engineering", "title": "12. Web, APIs & Backend Engineering", "duration": "5 hr", "level": "Core", "objectives": ["Explain HTTP and API semantics", "Design reliable endpoints", "Use authentication and authorization correctly", "Apply caching, queues, and idempotency"], "sections": [["HTTP essentials", "<p>Understand methods, status codes, headers, cookies, caching, and TLS. Use semantics correctly: GET is safe, PUT is intended to be idempotent, and POST commonly creates or triggers processing.</p>"], ["API design", "<p>Good APIs use clear resources, validation, consistent errors, pagination, versioning strategy, and observability. Avoid leaking internal implementation details.</p>"], ["Authentication and authorization", "<p>Authentication establishes identity. Authorization decides allowed actions. Sessions, OAuth, and token-based approaches solve different problems; no token format replaces access-control design.</p>"], ["Reliability patterns", "<p>Use timeouts, bounded retries with backoff, circuit breakers, idempotency keys, queues, and dead-letter handling. Retries without idempotency can duplicate side effects.</p>"]], "interviewer": "When designing an endpoint, discuss failure behavior—not just the happy path.", "exercise": "Design a payment-creation endpoint that safely handles client retries without double charging.", "quiz": [["Which HTTP method is intended to be safe and read-only?", ["GET", "POST", "PATCH", "DELETE"], 0, "GET should not intentionally change server state."], ["Authorization answers:", ["Who are you?", "What are you allowed to do?", "Is the server online?", "What is the database schema?"], 1, "Authentication establishes identity; authorization evaluates permissions."], ["Why use an idempotency key?", ["To compress responses", "To prevent duplicate side effects during retries", "To replace authentication", "To choose a port"], 1, "The server can recognize repeated requests as the same operation."], ["What should bounded retries include?", ["No delay", "Backoff and a maximum attempt or deadline", "Infinite loops", "A new password"], 1, "Unbounded immediate retries amplify outages."], ["What is a queue useful for?", ["Only frontend styling", "Decoupling and asynchronous processing", "Replacing all databases", "Making GET unsafe"], 1, "Queues absorb bursts and separate producers from consumers."]]}, {"id": "os-networking-concurrency", "phase": "Phase 3 · Practical Engineering", "title": "13. Operating Systems, Networking & Concurrency", "duration": "5 hr", "level": "Core", "objectives": ["Distinguish processes and threads", "Explain TCP, DNS, TLS, and latency", "Identify races and deadlocks", "Choose synchronization tools"], "sections": [["Processes and threads", "<p>A process has an isolated address space. Threads share process memory and require synchronization. Context switching, scheduling, and memory visibility influence performance and correctness.</p>"], ["Networking path", "<p>A typical request may involve DNS resolution, TCP connection establishment, TLS negotiation, proxies, load balancers, application servers, caches, and databases. Latency accumulates across these hops.</p>"], ["Race conditions", "<p>A race occurs when correctness depends on unpredictable interleaving. Locks, atomics, immutability, message passing, and confinement are common tools.</p>"], ["Deadlocks", "<p>Deadlock can occur when tasks hold resources while waiting in a cycle. Consistent lock ordering, timeouts, smaller critical sections, and avoiding nested locks reduce risk.</p>"]], "interviewer": "Do not say “threads are always faster.” Discuss workload, overhead, contention, and runtime constraints.", "exercise": "Explain how a non-atomic read-modify-write increment can lose updates under concurrency.", "quiz": [["Threads in the same process usually share:", ["Nothing", "Address space and process resources", "Different operating systems", "Only filenames"], 1, "Shared memory enables efficient communication but creates synchronization risk."], ["DNS primarily maps:", ["Passwords to tokens", "Names to network addresses", "Threads to processes", "SQL to NoSQL"], 1, "DNS resolves human-friendly hostnames to addresses and related records."], ["A race condition depends on:", ["Font size", "Uncontrolled timing or interleaving", "The number of comments", "Static HTML"], 1, "Different schedules can produce different results."], ["A deadlock requires a waiting cycle among resources or tasks.", ["True", "False"], 0, "Circular wait is one of the classic deadlock conditions."], ["TCP provides:", ["Reliable ordered byte delivery", "Guaranteed low latency", "Encryption by itself", "Database transactions"], 0, "TCP handles ordering, retransmission, and congestion control; TLS adds encryption."]]}, {"id": "quality-security", "phase": "Phase 3 · Practical Engineering", "title": "14. Testing, Debugging & Security", "duration": "5 hr", "level": "Core", "objectives": ["Build a layered testing strategy", "Debug systematically", "Explain common application vulnerabilities", "Use secure defaults and least privilege"], "sections": [["Testing layers", "<p>Unit tests isolate small behavior. Integration tests verify components together. End-to-end tests validate complete workflows but are slower and more brittle. A healthy suite uses the cheapest test that provides the required confidence.</p>"], ["Debugging method", "<p>Reproduce, reduce, observe, hypothesize, test, fix, and prevent regression. Change one variable at a time. Preserve evidence before restarting or modifying the system.</p>"], ["Security basics", "<p>Parameterized queries prevent SQL injection. Output encoding reduces XSS risk. CSRF defenses protect cookie-authenticated state changes. Passwords require slow, salted password hashing—not reversible encryption.</p>"], ["Least privilege", "<p>Grant users, services, and tokens only the permissions required. Rotate secrets, avoid logging sensitive values, and treat dependencies as part of the attack surface.</p>"]], "interviewer": "A good debugging answer includes the evidence you gathered and the regression test you added.", "exercise": "Write a postmortem outline for a production bug, including detection, impact, root cause, remediation, and prevention.", "quiz": [["What is the best defense against SQL injection?", ["String concatenation", "Parameterized queries", "Longer table names", "Client-side validation only"], 1, "Parameters separate code from data."], ["What should happen after fixing a reproducible bug?", ["Delete the logs", "Add a regression test", "Hide the issue", "Rename the function"], 1, "The test prevents the same failure from returning unnoticed."], ["End-to-end tests are generally:", ["Fastest and cheapest", "Broad but slower and more brittle", "Unable to test workflows", "A replacement for all unit tests"], 1, "They provide high-level confidence at higher cost."], ["Passwords should be stored using:", ["Plain text", "Reversible encryption only", "A slow salted password-hashing function", "Base64"], 2, "Password hashing should resist offline guessing attacks."], ["Least privilege means:", ["Everyone is an administrator", "Grant only required permissions", "Never use authentication", "Share one credential"], 1, "Limiting access reduces damage from errors or compromise."]]}, {"id": "system-design", "phase": "Phase 4 · Architecture", "title": "15. System Design Fundamentals", "duration": "6 hr", "level": "Core", "objectives": ["Clarify functional and nonfunctional requirements", "Estimate scale", "Design APIs and data models", "Discuss reliability, security, and tradeoffs"], "sections": [["A repeatable framework", "<ol><li>Clarify requirements.</li><li>Estimate scale and access patterns.</li><li>Define APIs and data model.</li><li>Draw core components and request flow.</li><li>Identify bottlenecks and failure modes.</li><li>Discuss scaling, security, observability, and tradeoffs.</li></ol>"], ["Storage decisions", "<p>Choose storage based on consistency needs, query patterns, relationships, scale, durability, and operational complexity—not fashion. Partitioning and replication solve different problems.</p>"], ["Caching", "<p>Caches reduce latency and backend load but introduce staleness and invalidation challenges. Decide what is cached, where, for how long, and how misses or failures behave.</p>"], ["Reliability", "<p>Eliminate single points of failure, design for partial failure, use health checks, timeouts, retries, redundancy, backpressure, and graceful degradation.</p>"]], "interviewer": "I care more about a clear, defensible design than an enormous diagram full of fashionable services.", "exercise": "Design a URL shortener for 100 million new links per month. State assumptions and calculate rough storage.", "quiz": [["What should happen first in system design?", ["Choose a database brand", "Clarify requirements and scope", "Draw microservices", "Add Kubernetes"], 1, "Design choices depend on what the system must do and at what scale."], ["Replication primarily improves:", ["Data availability and read capacity", "Source formatting", "Algorithm complexity", "Password length"], 0, "Copies support failover and may serve reads."], ["Partitioning primarily helps:", ["Distribute data and load", "Encrypt traffic", "Write CSS", "Avoid all consistency problems"], 0, "Partitioning splits data across nodes to scale capacity."], ["What major challenge does caching introduce?", ["Staleness and invalidation", "No speed improvement", "Mandatory recursion", "Loss of all data types"], 0, "Cached data can diverge from the source of truth."], ["A strong design discussion includes:", ["Only the happy path", "Failures, tradeoffs, and observability", "Only database tables", "No assumptions"], 1, "Real systems fail and must be operated."]]}, {"id": "cloud-devops", "phase": "Phase 4 · Architecture", "title": "16. Cloud, Linux & DevOps", "duration": "5 hr", "level": "Core", "objectives": ["Use Linux and Git confidently", "Explain containers and orchestration", "Design CI/CD pipelines", "Apply monitoring and safe deployment patterns"], "sections": [["Linux and shell", "<p>Know files, permissions, processes, pipes, environment variables, networking tools, logs, and basic shell scripting. Be able to investigate CPU, memory, disk, and port usage.</p>"], ["Containers", "<p>Containers package an application and dependencies while sharing the host kernel. Images should be reproducible, minimal, and run as non-root when possible.</p>"], ["CI/CD", "<p>A pipeline should build, test, scan, package, and deploy with traceability. Fast feedback belongs early. Production changes need rollback or roll-forward strategies.</p>"], ["Observability", "<p>Metrics show trends, logs provide event detail, and traces follow requests across services. Alerts should be actionable and tied to user impact or service objectives.</p>"]], "interviewer": "A deployment answer is incomplete without health checks, rollback, and a way to know whether the release is healthy.", "exercise": "Design a CI pipeline for a web API with unit tests, integration tests, security scanning, image build, staging, and production approval.", "quiz": [["Containers differ from VMs because containers typically:", ["Include a full guest kernel", "Share the host kernel", "Cannot isolate processes", "Require no image"], 1, "Containers isolate processes while sharing the host kernel."], ["What should a CI pipeline provide first?", ["Slow production deployment", "Fast feedback on build and tests", "Manual copying", "No logs"], 1, "Early failures are cheaper to fix."], ["A canary deployment sends:", ["All traffic to the new version immediately", "A small portion of traffic to the new version first", "No traffic anywhere", "Only database traffic"], 1, "Canaries limit blast radius while gathering evidence."], ["Which observability signal follows a request across services?", ["Trace", "CSS rule", "Commit message", "Heap sort"], 0, "Distributed traces connect spans across service boundaries."], ["Why avoid running containers as root?", ["It improves font rendering", "It reduces privileges if the container is compromised", "It makes images larger", "It disables networking"], 1, "Least privilege reduces potential impact."]]}, {"id": "python-track", "phase": "Phase 5 · Language Tracks", "title": "17. Python Interview Track", "duration": "5 hr", "level": "Language", "objectives": ["Use Python collections idiomatically", "Explain iterators, generators, decorators, and context managers", "Discuss concurrency and the GIL", "Write testable typed Python"], "sections": [["Collections and identity", "<p>Know list, tuple, dict, set, deque, heapq, and Counter. Understand equality versus identity, mutability, hashing, shallow copy, and deep copy.</p>"], ["Iteration model", "<p>An iterable can produce an iterator. An iterator maintains state and yields values until StopIteration. Generators provide iterator behavior with <code>yield</code> and lazy execution.</p>"], ["Functions and resource management", "<p>Decorators wrap callables. Context managers guarantee setup and cleanup around a block. Type hints improve tooling but are not runtime enforcement by default.</p>"], ["Concurrency", "<p>Threads are useful for I/O-bound work. Multiprocessing can use multiple CPU cores for CPU-bound work. Asyncio coordinates many waiting operations cooperatively.</p>"]], "interviewer": "Use Python’s strengths, but do not hide complexity in clever one-liners.", "exercise": "Implement an LRU cache using OrderedDict or a hash map plus doubly linked list, then discuss thread safety.", "quiz": [["A generator produces values:", ["All at once", "Lazily as requested", "Only in sorted order", "Without state"], 1, "Generators compute values on demand."], ["What is the difference between == and is?", ["No difference", "== compares equality; is compares identity", "is sorts values", "== checks types only"], 1, "Identity asks whether references point to the same object."], ["A context manager primarily guarantees:", ["Sorting", "Setup and cleanup around a block", "Static compilation", "Network encryption"], 1, "The with statement ensures exit handling even on exceptions."], ["For CPU-bound parallelism in standard CPython, prefer:", ["More threads only", "Multiprocessing or native code that releases the GIL", "A larger list", "A decorator"], 1, "The GIL limits parallel Python-bytecode execution in one process."], ["Which structure supports efficient append/pop at both ends?", ["list only", "collections.deque", "tuple", "set"], 1, "Deque is optimized for both ends."]]}, {"id": "js-ts-track", "phase": "Phase 5 · Language Tracks", "title": "18. JavaScript & TypeScript Interview Track", "duration": "6 hr", "level": "Language", "objectives": ["Explain closures, prototypes, and this", "Reason about the event loop", "Use promises and async/await", "Apply TypeScript narrowing and generics"], "sections": [["Execution and scope", "<p>Understand lexical scope, closures, hoisting behavior, and the differences among var, let, and const. A closure retains access to its lexical environment.</p>"], ["Event loop", "<p>Synchronous code runs on the call stack. Promise reactions are scheduled as microtasks. Timers and many events enter task queues. Long synchronous work blocks progress.</p>"], ["Objects and prototypes", "<p>JavaScript inheritance is prototype-based. The value of <code>this</code> depends on how a function is called, except arrow functions capture lexical <code>this</code>.</p>"], ["TypeScript", "<p>TypeScript uses structural typing. Narrow unions with checks, discriminated unions, predicates, or control-flow analysis. Generics preserve relationships between input and output types.</p>"]], "interviewer": "Do not describe async/await as creating threads. It is syntax over promise-based asynchronous control flow.", "exercise": "Predict the output order of synchronous logs, Promise.then callbacks, queueMicrotask, and setTimeout.", "quiz": [["A closure retains access to:", ["Only global variables", "Its lexical environment", "The database", "A separate thread"], 1, "Closures capture surrounding bindings."], ["Promise callbacks generally run as:", ["Microtasks", "CSS events", "Operating-system processes", "Database triggers"], 0, "Promise reactions are queued in the microtask queue."], ["Arrow functions differ because they:", ["Always return promises", "Capture lexical this", "Have their own prototype chain only", "Cannot accept arguments"], 1, "Arrow functions do not bind their own this."], ["TypeScript is primarily:", ["A database", "A typed superset of JavaScript", "A browser", "A CSS framework"], 1, "It adds static type checking and compiles to JavaScript."], ["Structural typing compares:", ["Type names only", "The shape and members of values", "File sizes", "Runtime speed"], 1, "Compatibility is based on required structure."]]}, {"id": "java-csharp-track", "phase": "Phase 5 · Language Tracks", "title": "19. Java & C# Interview Track", "duration": "6 hr", "level": "Language", "objectives": ["Explain managed runtimes and garbage collection", "Use generics, collections, and async constructs", "Compare value and reference semantics", "Discuss dependency injection and testing"], "sections": [["Managed runtimes", "<p>Java runs on the JVM; C# commonly runs on .NET’s CLR. Both provide JIT compilation, garbage collection, rich type systems, and mature concurrency libraries.</p>"], ["Generics and collections", "<p>Know common list, set, map, queue, and concurrent collections. Java generics use type erasure; C# generics retain more runtime type information and support value-type specialization.</p>"], ["Concurrency", "<p>Understand threads, locks, atomics, futures/tasks, async/await in C#, and CompletableFuture or executor frameworks in Java. Volatile provides visibility guarantees but does not make compound actions atomic.</p>"], ["Architecture", "<p>Dependency injection separates object construction from behavior. Interfaces improve substitution and testing, but too many abstractions can obscure simple code.</p>"]], "interviewer": "When discussing volatile, distinguish visibility from atomicity.", "exercise": "Implement a thread-safe in-memory counter and explain lock, atomic, and contention tradeoffs.", "quiz": [["Java code commonly runs on the:", ["CLR", "JVM", "DOM", "GPU only"], 1, "The Java Virtual Machine executes bytecode."], ["C# async methods commonly return:", ["Task or Task<T>", "Only threads", "HTML", "Pointers"], 0, "Tasks represent asynchronous operations."], ["Does volatile make increment atomic?", ["Always", "No, read-modify-write can still race", "Only for strings", "Only in tests"], 1, "Visibility does not combine separate operations into one atomic action."], ["Dependency injection primarily separates:", ["CSS from HTML", "Object construction from business behavior", "SQL from tables", "Threads from CPUs"], 1, "Dependencies are supplied rather than constructed internally."], ["Java generic type information is commonly affected by:", ["Type erasure", "CSS cascading", "DNS caching", "Link-state routing"], 0, "Most generic type parameters are erased at runtime."]]}, {"id": "systems-languages", "phase": "Phase 5 · Language Tracks", "title": "20. C++, Go & Rust Interview Track", "duration": "7 hr", "level": "Language", "objectives": ["Explain ownership and resource lifetime", "Use concurrency models safely", "Compare RAII, GC, and borrow checking", "Choose systems-language tradeoffs"], "sections": [["C++", "<p>Know RAII, object lifetime, constructors, destructors, copy and move semantics, smart pointers, templates, STL containers, and undefined behavior. Prefer ownership clarity over raw pointers.</p>"], ["Go", "<p>Know goroutines, channels, interfaces, slices, maps, error handling, context cancellation, and the race detector. Channels coordinate; mutexes may still be the simpler tool for shared state.</p>"], ["Rust", "<p>Rust enforces ownership, borrowing, and lifetimes to prevent many memory and data-race errors at compile time. Result and Option make failure and absence explicit.</p>"], ["Tradeoffs", "<p>C++ offers maximum control and a vast ecosystem, Go emphasizes simplicity and operational tooling, and Rust prioritizes memory safety without garbage collection. Role context matters.</p>"]], "interviewer": "Do not reduce language comparison to “fast versus slow.” Discuss safety, control, ecosystem, compile time, ergonomics, and operational needs.", "exercise": "Compare how C++, Go, and Rust would model ownership of a shared cache used by concurrent requests.", "quiz": [["RAII ties resource cleanup to:", ["Random timers", "Object lifetime", "Database rows", "Browser events"], 1, "Destructors release resources when owning objects leave scope."], ["Go concurrency commonly uses:", ["Goroutines and channels", "Only OS processes", "HTML workers", "SQL joins"], 0, "Goroutines are lightweight tasks; channels coordinate communication."], ["Rust’s borrow checker primarily enforces:", ["CSS syntax", "Ownership and reference safety", "Database normalization", "HTTP status codes"], 1, "It prevents invalid aliasing and lifetime errors at compile time."], ["Which C++ pointer expresses exclusive ownership?", ["shared_ptr", "unique_ptr", "raw pointer always", "weak_ptr"], 1, "unique_ptr has one owner and transfers ownership by move."], ["Go context is commonly used for:", ["Color themes", "Cancellation, deadlines, and request-scoped values", "Sorting integers only", "Memory allocation control"], 1, "Context propagates cancellation and deadlines through call chains."]]}, {"id": "mobile-languages", "phase": "Phase 5 · Language Tracks", "title": "21. Kotlin & Swift Interview Track", "duration": "5 hr", "level": "Language", "objectives": ["Use null/optional safety", "Explain value and reference semantics", "Apply coroutines and structured concurrency", "Discuss mobile lifecycle and UI architecture"], "sections": [["Kotlin", "<p>Know nullable types, safe calls, Elvis operator, data classes, sealed classes, extension functions, coroutines, flows, and Java interoperability.</p>"], ["Swift", "<p>Know optionals, structs versus classes, protocols, extensions, closures, ARC, async/await, actors, and value semantics.</p>"], ["Mobile engineering", "<p>Understand lifecycle, state restoration, offline behavior, network errors, background work, accessibility, battery use, and testability. UI frameworks do not eliminate architecture decisions.</p>"], ["Concurrency", "<p>Both ecosystems increasingly emphasize structured concurrency: child tasks belong to a scope, cancellation propagates, and lifetime is explicit.</p>"]], "interviewer": "For mobile questions, discuss what happens when the app is backgrounded, rotated, disconnected, or memory constrained.", "exercise": "Design a resilient mobile screen that loads paginated data, caches it, supports retry, and survives configuration changes.", "quiz": [["Kotlin nullable types use:", ["A question mark marker", "Only comments", "A database field", "A pointer star"], 0, "For example, String? explicitly permits null."], ["Swift structs typically have:", ["Reference semantics", "Value semantics", "No methods", "Automatic network access"], 1, "Assignments copy value semantics, subject to implementation optimizations."], ["ARC stands for:", ["Automatic Reference Counting", "Array Runtime Cache", "Async Resource Channel", "Application Route Control"], 0, "Swift uses reference counting for class instances."], ["Structured concurrency improves:", ["Task lifetime and cancellation reasoning", "Screen brightness", "SQL syntax", "Heap ordering"], 0, "Tasks belong to scopes and cancellation can propagate predictably."], ["A sealed class or enum is useful for:", ["Representing a closed set of states", "Opening network ports", "Replacing tests", "Disabling types"], 0, "Closed variants enable exhaustive handling of states."]]}, {"id": "ai-engineering", "phase": "Phase 6 · Career Readiness", "title": "22. AI-Assisted Software Engineering", "duration": "3 hr", "level": "Modern Practice", "objectives": ["Use AI without surrendering judgment", "Verify generated code and APIs", "Protect sensitive data", "Explain responsible AI workflows in interviews"], "sections": [["Use AI as a collaborator", "<p>AI can accelerate exploration, boilerplate, tests, documentation, and alternatives. It does not own correctness. The engineer remains responsible for security, behavior, licensing, performance, and maintainability.</p>"], ["Verification loop", "<ol><li>State constraints.</li><li>Request an approach before code.</li><li>Check APIs against documentation.</li><li>Run tests and static analysis.</li><li>Review edge cases and security.</li><li>Explain every line you keep.</li></ol>"], ["Interview positioning", "<p>Do not say “the AI built my project.” Explain how you decomposed the work, selected architecture, verified output, wrote tests, debugged failures, and made final decisions.</p>"], ["Privacy and security", "<p>Never paste secrets, proprietary source, customer data, or protected information into tools without organizational approval and appropriate controls.</p>"]], "interviewer": "AI fluency is a positive signal only when paired with independent understanding and verification.", "exercise": "Take an AI-generated function and perform a formal review: correctness, complexity, edge cases, security, tests, and maintainability.", "quiz": [["Who remains responsible for AI-generated code?", ["The model", "The engineer and organization using it", "Nobody", "The compiler only"], 1, "Generated output must be reviewed like any untrusted contribution."], ["What should you verify when an AI suggests an API?", ["Only spelling", "Documentation, version, behavior, and security", "The logo", "Nothing"], 1, "Models can hallucinate or mix versions."], ["Which data should not be pasted into an unapproved tool?", ["Public sample text", "Secrets and proprietary customer data", "A generic algorithm", "A local variable name"], 1, "Sensitive data requires approved handling."], ["A strong interview explanation of AI use emphasizes:", ["Blind speed", "Decomposition, verification, and ownership", "That no tests were needed", "Copying entire projects"], 1, "Responsible use preserves engineering judgment."], ["Generated tests are sufficient without review.", ["True", "False"], 1, "Tests can encode the same misunderstanding as the generated implementation."]]}, {"id": "behavioral", "phase": "Phase 6 · Career Readiness", "title": "23. Behavioral Interview Mastery", "duration": "5 hr", "level": "Career", "objectives": ["Build STAR-R stories", "Answer conflict, failure, and ownership questions", "Use evidence and metrics", "Avoid vague or defensive answers"], "sections": [["STAR-R", "<p><strong>Situation:</strong> concise context. <strong>Task:</strong> your responsibility. <strong>Action:</strong> what you personally did. <strong>Result:</strong> measurable outcome. <strong>Reflection:</strong> what you learned and changed.</p>"], ["Story bank", "<p>Prepare at least twelve adaptable stories: failure, conflict, ambiguity, leadership, ownership, difficult bug, tight deadline, quality improvement, customer impact, learning, ethical concern, and receiving feedback.</p>"], ["Specificity", "<p>Replace “we worked hard” with decisions, evidence, and your contribution. Metrics may include time saved, errors reduced, latency improved, users helped, incidents prevented, or delivery risk reduced.</p>"], ["Professional self-awareness", "<p>Strong answers do not blame teammates. They show accountability without taking false responsibility for everything. Reflection should describe a concrete behavior change.</p>"]], "interviewer": "The Action section is where I determine what you actually did. Keep the Situation short.", "exercise": "Write twelve STAR-R story outlines, each in five bullet points, then practice answering in under two minutes.", "quiz": [["Which STAR-R section should be longest?", ["Situation", "Task", "Action", "Title"], 2, "Interviewers need evidence of your decisions and behavior."], ["A strong failure answer includes:", ["A fake weakness", "Ownership, correction, and changed behavior", "Blaming a teammate", "No result"], 1, "Learning must produce a concrete improvement."], ["Why use metrics in behavioral answers?", ["To sound complicated", "To make impact concrete and credible", "To avoid explaining actions", "To increase interview length"], 1, "Evidence helps the interviewer understand scale and result."], ["How should conflict stories describe the other person?", ["As incompetent", "Professionally and fairly", "Without any context", "Using insults"], 1, "Conflict answers test collaboration and emotional maturity."], ["How many reusable stories should a candidate prepare?", ["One", "At least a varied story bank, around 10–12", "Zero", "One per company employee"], 1, "A story bank lets you adapt without inventing answers live."]]}, {"id": "portfolio-final", "phase": "Phase 6 · Career Readiness", "title": "24. Resume, Projects & Final Interview Loop", "duration": "6 hr", "level": "Career", "objectives": ["Present projects with technical depth", "Defend architecture choices", "Build an interview-ready resume", "Complete full mock loops and remediation"], "sections": [["Project deep dive", "<p>Be ready to explain the problem, users, architecture, data model, deployment, testing, security, hardest bug, tradeoffs, your personal contribution, and what you would redesign.</p>"], ["Resume evidence", "<p>Use accomplishment bullets: action, technical scope, and result. Avoid tool inventories without context. Every claim should survive follow-up questions.</p>"], ["Final loop", "<p>Simulate the complete process: recruiter pitch, coding round, fundamentals, project deep dive, behavioral round, and system design. Use the rubric to identify the lowest-scoring dimension.</p>"], ["Readiness standard", "<p>Interview-ready means consistent performance, not one lucky solution. Aim for clear problem framing, correct medium problems with testing, defensible design, and concise evidence-based stories.</p>"]], "interviewer": "Your project is credible only to the depth you can explain and defend it.", "exercise": "Deliver a 10-minute project walkthrough, then answer 15 minutes of adversarial follow-up questions.", "quiz": [["A strong resume bullet contains:", ["Only technology names", "Action, scope, and outcome", "Personal hobbies only", "Every class taken"], 1, "Evidence-based bullets show what changed because of your work."], ["What should you say about a project decision you would now change?", ["Nothing was imperfect", "Explain the original context, tradeoff, and better current choice", "Blame the framework", "Hide the project"], 1, "Reflection demonstrates growth and judgment."], ["What is the best readiness measure?", ["One solved hard problem", "Consistent performance across repeated mocks", "Number of browser tabs", "Number of languages listed"], 1, "Reliable interview performance requires repeatability."], ["Every resume claim should be:", ["Impossible to verify", "Defensible under technical follow-up", "Written in jargon", "At least four lines"], 1, "Interviewers often drill into specific claims."], ["After a mock interview, what should remediation target first?", ["The easiest area", "The lowest-scoring recurring weakness", "A random language", "Resume font"], 1, "Focused practice should address the limiting skill."]]}], "labs": [{"id": "two-sum", "title": "Two Sum", "difficulty": "Easy", "pattern": "Hash Map", "prompt": "Given an integer array and a target, return the indices of two distinct values whose sum equals the target. Assume exactly one solution exists.", "constraints": ["Do not reuse the same element", "Aim for O(n) time"], "hints": ["For each value, what complement would complete the target?", "Store values you have already seen."], "solutions": {"Python": "def two_sum(nums: list[int], target: int) -> list[int]:\n    seen: dict[int, int] = {}\n    for index, value in enumerate(nums):\n        complement = target - value\n        if complement in seen:\n            return [seen[complement], index]\n        seen[value] = index\n    raise ValueError(\"No solution\")", "JavaScript": "function twoSum(nums, target) {\n  const seen = new Map();\n  for (let i = 0; i < nums.length; i++) {\n    const complement = target - nums[i];\n    if (seen.has(complement)) return [seen.get(complement), i];\n    seen.set(nums[i], i);\n  }\n  throw new Error(\"No solution\");\n}", "Java": "static int[] twoSum(int[] nums, int target) {\n    Map<Integer, Integer> seen = new HashMap<>();\n    for (int i = 0; i < nums.length; i++) {\n        int complement = target - nums[i];\n        if (seen.containsKey(complement)) return new int[]{seen.get(complement), i};\n        seen.put(nums[i], i);\n    }\n    throw new IllegalArgumentException(\"No solution\");\n}"}, "complexity": "O(n) time, O(n) space", "tests": ["[2,7,11,15], 9 → [0,1]", "[3,3], 6 → [0,1]", "Negative numbers and zero"]}, {"id": "valid-anagram", "title": "Valid Anagram", "difficulty": "Easy", "pattern": "Counting", "prompt": "Return true when two strings contain exactly the same character counts. Clarify normalization rules.", "constraints": ["Discuss Unicode and case sensitivity", "Avoid sorting if targeting O(n)"], "hints": ["A frequency map can track net counts.", "Lengths must match under the chosen normalization."], "solutions": {"Python": "from collections import Counter\n\ndef is_anagram(a: str, b: str) -> bool:\n    return Counter(a) == Counter(b)", "JavaScript": "function isAnagram(a, b) {\n  if (a.length !== b.length) return false;\n  const counts = new Map();\n  for (const ch of a) counts.set(ch, (counts.get(ch) ?? 0) + 1);\n  for (const ch of b) {\n    const next = (counts.get(ch) ?? 0) - 1;\n    if (next < 0) return false;\n    counts.set(ch, next);\n  }\n  return true;\n}", "Java": "static boolean isAnagram(String a, String b) {\n    if (a.length() != b.length()) return false;\n    Map<Character, Integer> counts = new HashMap<>();\n    for (char c : a.toCharArray()) counts.merge(c, 1, Integer::sum);\n    for (char c : b.toCharArray()) {\n        int next = counts.getOrDefault(c, 0) - 1;\n        if (next < 0) return false;\n        counts.put(c, next);\n    }\n    return true;\n}"}, "complexity": "O(n) time, O(k) space for distinct characters", "tests": ["\"anagram\", \"nagaram\" → true", "\"rat\", \"car\" → false", "Empty strings"]}, {"id": "longest-substring", "title": "Longest Unique Substring", "difficulty": "Medium", "pattern": "Sliding Window", "prompt": "Return the length of the longest substring with no repeated characters.", "constraints": ["Aim for O(n)", "The substring must be contiguous"], "hints": ["Track the most recent position of each character.", "Move left past the duplicate, never backward."], "solutions": {"Python": "def longest_unique(text: str) -> int:\n    last_seen: dict[str, int] = {}\n    left = 0\n    best = 0\n    for right, ch in enumerate(text):\n        if ch in last_seen and last_seen[ch] >= left:\n            left = last_seen[ch] + 1\n        last_seen[ch] = right\n        best = max(best, right - left + 1)\n    return best", "JavaScript": "function longestUnique(text) {\n  const lastSeen = new Map();\n  let left = 0, best = 0;\n  for (let right = 0; right < text.length; right++) {\n    const ch = text[right];\n    if (lastSeen.has(ch) && lastSeen.get(ch) >= left) left = lastSeen.get(ch) + 1;\n    lastSeen.set(ch, right);\n    best = Math.max(best, right - left + 1);\n  }\n  return best;\n}", "Java": "static int longestUnique(String text) {\n    Map<Character, Integer> lastSeen = new HashMap<>();\n    int left = 0, best = 0;\n    for (int right = 0; right < text.length(); right++) {\n        char ch = text.charAt(right);\n        if (lastSeen.containsKey(ch) && lastSeen.get(ch) >= left) left = lastSeen.get(ch) + 1;\n        lastSeen.put(ch, right);\n        best = Math.max(best, right - left + 1);\n    }\n    return best;\n}"}, "complexity": "O(n) time, O(k) space", "tests": ["\"abcabcbb\" → 3", "\"bbbbb\" → 1", "\"abba\" → 2", "\"\" → 0"]}, {"id": "merge-intervals", "title": "Merge Intervals", "difficulty": "Medium", "pattern": "Sorting", "prompt": "Merge all overlapping intervals and return the non-overlapping result.", "constraints": ["Clarify whether touching endpoints overlap", "Input order is arbitrary"], "hints": ["Sort by start time.", "Compare only with the last merged interval."], "solutions": {"Python": "def merge(intervals: list[list[int]]) -> list[list[int]]:\n    if not intervals:\n        return []\n    intervals.sort(key=lambda x: x[0])\n    merged = [intervals[0][:]]\n    for start, end in intervals[1:]:\n        if start <= merged[-1][1]:\n            merged[-1][1] = max(merged[-1][1], end)\n        else:\n            merged.append([start, end])\n    return merged", "JavaScript": "function merge(intervals) {\n  if (!intervals.length) return [];\n  intervals.sort((a, b) => a[0] - b[0]);\n  const merged = [[...intervals[0]]];\n  for (let i = 1; i < intervals.length; i++) {\n    const [start, end] = intervals[i];\n    const last = merged[merged.length - 1];\n    if (start <= last[1]) last[1] = Math.max(last[1], end);\n    else merged.push([start, end]);\n  }\n  return merged;\n}", "Java": "static int[][] merge(int[][] intervals) {\n    if (intervals.length == 0) return new int[0][0];\n    Arrays.sort(intervals, Comparator.comparingInt(a -> a[0]));\n    List<int[]> out = new ArrayList<>();\n    out.add(intervals[0].clone());\n    for (int i = 1; i < intervals.length; i++) {\n        int[] last = out.get(out.size() - 1);\n        if (intervals[i][0] <= last[1]) last[1] = Math.max(last[1], intervals[i][1]);\n        else out.add(intervals[i].clone());\n    }\n    return out.toArray(new int[out.size()][]);\n}"}, "complexity": "O(n log n) time, O(n) output space", "tests": ["[[1,3],[2,6],[8,10]] → [[1,6],[8,10]]", "Nested intervals", "Empty input"]}, {"id": "binary-search", "title": "Lower Bound Binary Search", "difficulty": "Medium", "pattern": "Binary Search", "prompt": "Return the first index where the sorted array value is greater than or equal to target. Return array length if none exists.", "constraints": ["Use a half-open [left,right) interval", "Avoid infinite loops"], "hints": ["The answer is in [left,right).", "When nums[mid] is large enough, keep mid."], "solutions": {"Python": "def lower_bound(nums: list[int], target: int) -> int:\n    left, right = 0, len(nums)\n    while left < right:\n        mid = left + (right - left) // 2\n        if nums[mid] < target:\n            left = mid + 1\n        else:\n            right = mid\n    return left", "JavaScript": "function lowerBound(nums, target) {\n  let left = 0, right = nums.length;\n  while (left < right) {\n    const mid = left + Math.floor((right - left) / 2);\n    if (nums[mid] < target) left = mid + 1;\n    else right = mid;\n  }\n  return left;\n}", "C++": "int lowerBound(const vector<int>& nums, int target) {\n    int left = 0, right = static_cast<int>(nums.size());\n    while (left < right) {\n        int mid = left + (right - left) / 2;\n        if (nums[mid] < target) left = mid + 1;\n        else right = mid;\n    }\n    return left;\n}"}, "complexity": "O(log n) time, O(1) space", "tests": ["[1,3,3,5], 3 → 1", "[1,3,5], 4 → 2", "[], 7 → 0"]}, {"id": "reverse-list", "title": "Reverse Linked List", "difficulty": "Easy", "pattern": "Pointers", "prompt": "Reverse a singly linked list and return the new head.", "constraints": ["Do not allocate replacement nodes", "Preserve every node exactly once"], "hints": ["Save next before changing current.next.", "Track previous and current."], "solutions": {"Python": "def reverse_list(head):\n    previous = None\n    current = head\n    while current:\n        next_node = current.next\n        current.next = previous\n        previous = current\n        current = next_node\n    return previous", "JavaScript": "function reverseList(head) {\n  let previous = null;\n  let current = head;\n  while (current) {\n    const nextNode = current.next;\n    current.next = previous;\n    previous = current;\n    current = nextNode;\n  }\n  return previous;\n}", "Java": "static ListNode reverseList(ListNode head) {\n    ListNode previous = null;\n    ListNode current = head;\n    while (current != null) {\n        ListNode next = current.next;\n        current.next = previous;\n        previous = current;\n        current = next;\n    }\n    return previous;\n}"}, "complexity": "O(n) time, O(1) extra space", "tests": ["Empty list", "One node", "1→2→3 becomes 3→2→1"]}, {"id": "valid-parentheses", "title": "Valid Parentheses", "difficulty": "Easy", "pattern": "Stack", "prompt": "Return true when every opening delimiter is closed by the correct type in the correct order.", "constraints": ["Support (), [], and {}", "Reject a closing delimiter without a matching opener"], "hints": ["Closing delimiters must match the most recent unmatched opener."], "solutions": {"Python": "def valid_parentheses(text: str) -> bool:\n    match = {')': '(', ']': '[', '}': '{'}\n    stack: list[str] = []\n    for ch in text:\n        if ch in match.values():\n            stack.append(ch)\n        elif ch in match:\n            if not stack or stack.pop() != match[ch]:\n                return False\n    return not stack", "JavaScript": "function validParentheses(text) {\n  const match = new Map([[')', '('], [']', '['], ['}', '{']]);\n  const stack = [];\n  for (const ch of text) {\n    if ([...match.values()].includes(ch)) stack.push(ch);\n    else if (match.has(ch) && stack.pop() !== match.get(ch)) return false;\n  }\n  return stack.length === 0;\n}", "C#": "static bool ValidParentheses(string text) {\n    var match = new Dictionary<char, char>{{')','('},{']','['},{'}','{'}};\n    var stack = new Stack<char>();\n    foreach (char ch in text) {\n        if (ch is '(' or '[' or '{') stack.Push(ch);\n        else if (match.ContainsKey(ch) && (stack.Count == 0 || stack.Pop() != match[ch])) return false;\n    }\n    return stack.Count == 0;\n}"}, "complexity": "O(n) time, O(n) space", "tests": ["\"()[]{}\" → true", "\"([)]\" → false", "\"((\" → false"]}, {"id": "top-k", "title": "Top K
