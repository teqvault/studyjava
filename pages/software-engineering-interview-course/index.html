t[amount + 1];\n    Arrays.fill(dp, unreachable);\n    dp[0] = 0;\n    for (int current = 1; current <= amount; current++) {\n        for (int coin : coins) if (coin <= current) dp[current] = Math.min(dp[current], dp[current - coin] + 1);\n    }\n    return dp[amount] == unreachable ? -1 : dp[amount];\n}"},"complexity":"O(amount × number of coins) time, O(amount) space","tests":["[1,2,5], 11 → 3","[2], 3 → -1","Any coins, 0 → 0"]},{"id":"sql-latest-order","title":"Latest Order per Customer","difficulty":"Medium","pattern":"SQL Window Function","prompt":"Given customers and orders, return each customer’s latest order while preserving customers with no orders.","constraints":["Ties must be deterministic","Preserve customers without orders"],"hints":["Rank orders per customer before joining.","Use ROW_NUMBER with a tie-breaker."],"solutions":{"SQL":"WITH ranked_orders AS (\n  SELECT\n    o.*,\n    ROW_NUMBER() OVER (\n      PARTITION BY customer_id\n      ORDER BY ordered_at DESC, order_id DESC\n    ) AS row_num\n  FROM orders AS o\n)\nSELECT\n  c.customer_id,\n  c.name,\n  r.order_id,\n  r.ordered_at,\n  r.total\nFROM customers AS c\nLEFT JOIN ranked_orders AS r\n  ON r.customer_id = c.customer_id\n AND r.row_num = 1;"},"complexity":"Depends on database plan; index (customer_id, ordered_at DESC) can help","tests":["Customer with multiple orders","Customer with no orders","Two orders at same timestamp"]},{"id":"lru-cache","title":"LRU Cache","difficulty":"Medium","pattern":"Hash Map + Doubly Linked List","prompt":"Implement get and put in O(1), evicting the least recently used key when capacity is exceeded.","constraints":["Both operations must be O(1)","Updating an existing key refreshes recency"],"hints":["Map keys to nodes.","Use a doubly linked list with sentinels for recency order."],"solutions":{"Python":"class Node:\n    def __init__(self, key=0, value=0):\n        self.key, self.value = key, value\n        self.prev = self.next = None\n\nclass LRUCache:\n    def __init__(self, capacity: int):\n        self.capacity = capacity\n        self.nodes = {}\n        self.left, self.right = Node(), Node()\n        self.left.next, self.right.prev = self.right, self.left\n\n    def _remove(self, node):\n        node.prev.next, node.next.prev = node.next, node.prev\n\n    def _insert_recent(self, node):\n        previous = self.right.prev\n        previous.next = self.right.prev = node\n        node.prev, node.next = previous, self.right\n\n    def get(self, key: int) -> int:\n        if key not in self.nodes: return -1\n        node = self.nodes[key]\n        self._remove(node); self._insert_recent(node)\n        return node.value\n\n    def put(self, key: int, value: int) -> None:\n        if key in self.nodes: self._remove(self.nodes[key])\n        node = Node(key, value); self.nodes[key] = node; self._insert_recent(node)\n        if len(self.nodes) > self.capacity:\n            lru = self.left.next\n            self._remove(lru); del self.nodes[lru.key]"},"complexity":"O(1) average get and put; O(capacity) space","tests":["Capacity 1","Update existing key","Get refreshes recency","Eviction order"]},{"id":"rate-limiter","title":"Design a Rate Limiter","difficulty":"System Design","pattern":"Distributed Systems","prompt":"Design a service that limits requests per user or API key across multiple application servers.","constraints":["Support bursts and steady limits","Decide consistency requirements","Handle clock and storage failures"],"hints":["Compare fixed window, sliding window, and token bucket.","Discuss where state lives and how requests are identified."],"solutions":{"Architecture":"Recommended baseline: token bucket per identity.\n\n1. Authenticate the request and derive a stable key.\n2. Store tokens and last-refill timestamp in a low-latency shared store.\n3. Use an atomic script/transaction to refill and consume.\n4. Return 429 with retry metadata when empty.\n5. Partition by key, monitor hot keys, and fail according to business risk.\n6. For extreme scale, add local allowance leases to reduce shared-store traffic.\n\nTradeoffs: exact global enforcement increases latency and dependency on shared state; approximate local limits improve availability."},"complexity":"O(1) work per request; distributed coordination dominates","tests":["Burst at boundary","Concurrent requests on different servers","Store timeout","Hot API key"]},{"id":"url-shortener","title":"Design a URL Shortener","difficulty":"System Design","pattern":"Architecture","prompt":"Design a service that creates short links and redirects them at high read volume.","constraints":["Short codes must be unique","Redirects should be low latency","Support expiration and abuse controls"],"hints":["Estimate read/write ratio and storage.","Separate creation from redirect path."],"solutions":{"Architecture":"Core components:\n- Create API validates URLs, authorizes callers, and allocates a unique ID.\n- Base62 encoding converts IDs to compact codes.\n- Durable primary storage maps code → destination and metadata.\n- Cache serves popular redirects.\n- Redirect service returns 301 or 302 based on product requirements.\n- Async analytics records clicks without slowing redirects.\n- Abuse scanning, rate limiting, expiration, and domain blocking protect users.\n\nScale path: partition by code hash, replicate reads, warm cache for hot links, and make analytics eventually consistent."},"complexity":"Redirect path should be near O(1) key lookup","tests":["Hot viral link","Expired link","Duplicate custom alias","Malicious destination"]},{"id":"debugging-lab","title":"Production Debugging Drill","difficulty":"Practical","pattern":"Debugging","prompt":"A deployment caused intermittent 500 errors, but CPU and memory look normal. Describe your investigation before proposing a fix.","constraints":["Preserve evidence","Avoid changing multiple variables at once"],"hints":["Compare failing and successful requests.","Check deploy diff, logs, traces, dependencies, and feature flags."],"solutions":{"Approach":"1. Confirm impact, timing, affected endpoints, users, and regions.\n2. Preserve logs, traces, metrics, deploy metadata, and request IDs.\n3. Compare successful and failed requests for a distinguishing dimension.\n4. Check dependency errors, timeouts, pool exhaustion, schema mismatch, and feature flags.\n5. Reproduce in a controlled environment with the same configuration and input.\n6. Mitigate safely with rollback or flag disablement if impact is material.\n7. Fix the smallest verified cause.\n8. Add a regression test, monitor, and postmortem action."},"complexity":"The goal is evidence quality, not algorithmic complexity","tests":["Only one region fails","Only old clients fail","Dependency latency spike","Database migration mismatch"]},{"id":"valid-anagram","title":"Valid Anagram","difficulty":"Easy","pattern":"Hash Map","prompt":"Return whether two strings contain the same character counts.","constraints":["Clarify Unicode/case handling","Avoid sorting if targeting O(n)"],"hints":["Count characters in one pass per string.","Compare frequency maps."],"solutions":{"Python":"def is_anagram(a: str, b: str) -> bool:\n    if len(a) != len(b): return False\n    counts = {}\n    for ch in a: counts[ch] = counts.get(ch, 0) + 1\n    for ch in b:\n        if ch not in counts: return False\n        counts[ch] -= 1\n        if counts[ch] == 0: del counts[ch]\n    return not counts"},"complexity":"O(n) time, O(k) space","tests":["\"listen\", \"silent\" → True","Different lengths","Repeated characters"]},{"id":"product-except-self","title":"Product Except Self","difficulty":"Medium","pattern":"Prefix/Suffix","prompt":"Return an array where each position is the product of all other values without division.","constraints":["O(n) time","O(1) extra space excluding output"],"hints":["Store prefix products in output.","Multiply by a rolling suffix product."],"solutions":{"Python":"def product_except_self(nums):\n    out=[1]*len(nums)\n    p=1\n    for i,x in enumerate(nums): out[i],p=p,p*x\n    s=1\n    for i in range(len(nums)-1,-1,-1): out[i],s=out[i]*s,s*nums[i]\n    return out"},"complexity":"O(n) time, O(1) auxiliary space","tests":["[1,2,3,4] → [24,12,8,6]","Contains one zero","Contains two zeros"]},{"id":"minimum-window","title":"Minimum Window Substring","difficulty":"Hard","pattern":"Sliding Window","prompt":"Return the smallest substring of s containing all characters of t with multiplicity.","constraints":["Preserve multiplicity","Return empty if impossible"],"hints":["Track required counts and formed requirements.","Shrink only while valid."],"solutions":{"Python":"def min_window(s,t):\n    from collections import Counter\n    need=Counter(t); have={}; formed=0; required=len(need); left=0; best=(10**9,0,0)\n    for right,ch in enumerate(s):\n        have[ch]=have.get(ch,0)+1\n        if ch in need and have[ch]==need[ch]: formed+=1\n        while formed==required:\n            if right-left+1<best[0]: best=(right-left+1,left,right)\n            c=s[left]; have[c]-=1\n            if c in need and have[c]<need[c]: formed-=1\n            left+=1\n    return '' if best[0]==10**9 else s[best[1]:best[2]+1]"},"complexity":"O(|s|+|t|) time, O(k) space","tests":["ADOBECODEBANC / ABC → BANC","Impossible case","Repeated target character"]},{"id":"merge-intervals-2","title":"Merge Intervals","difficulty":"Medium","pattern":"Intervals","prompt":"Merge all overlapping intervals.","constraints":["Define touching behavior","Input may be unsorted"],"hints":["Sort by start.","Compare current start to last merged end."],"solutions":{"Python":"def merge(intervals):\n    intervals.sort()\n    out=[]\n    for start,end in intervals:\n        if not out or start>out[-1][1]: out.append([start,end])\n        else: out[-1][1]=max(out[-1][1],end)\n    return out"},"complexity":"O(n log n) time, O(n) output","tests":["Nested intervals","Touching intervals","Empty input"]},{"id":"kth-largest","title":"Kth Largest Element","difficulty":"Medium","pattern":"Heap","prompt":"Return the kth largest value.","constraints":["Duplicates count","Avoid full sorting when useful"],"hints":["Maintain a min-heap of size k.","The root is the kth largest."],"solutions":{"Python":"import heapq\ndef kth_largest(nums,k):\n    heap=[]\n    for x in nums:\n        heapq.heappush(heap,x)\n        if len(heap)>k: heapq.heappop(heap)\n    return heap[0]"},"complexity":"O(n log k) time, O(k) space","tests":["Duplicates","k=1","k=len(nums)"]},{"id":"number-islands","title":"Number of Islands","difficulty":"Medium","pattern":"Graph DFS/BFS","prompt":"Count connected groups of land in a grid.","constraints":["Four-direction adjacency","Avoid revisiting cells"],"hints":["Each unvisited land cell starts a traversal.","Mark visited when enqueued or entered."],"solutions":{"Python":"def num_islands(grid):\n    if not grid:return 0\n    rows,cols=len(grid),len(grid[0]); count=0\n    def dfs(r,c):\n        if r<0 or c<0 or r>=rows or c>=cols or grid[r][c]!='1':return\n        grid[r][c]='0'\n        for dr,dc in ((1,0),(-1,0),(0,1),(0,-1)):dfs(r+dr,c+dc)\n    for r in range(rows):\n        for c in range(cols):\n            if grid[r][c]=='1': count+=1;dfs(r,c)\n    return count"},"complexity":"O(rows×cols) time, O(rows×cols) worst-case stack","tests":["All water","One island","Diagonal land is separate"]},{"id":"course-schedule","title":"Course Schedule","difficulty":"Medium","pattern":"Topological Sort","prompt":"Determine whether all courses can be completed given prerequisites.","constraints":["Directed graph","Cycle means impossible"],"hints":["Track indegrees.","Process zero-indegree nodes with a queue."],"solutions":{"Python":"from collections import deque\ndef can_finish(n, prereqs):\n    graph=[[] for _ in range(n)]; indeg=[0]*n\n    for course,pre in prereqs: graph[pre].append(course);indeg[course]+=1\n    q=deque(i for i,d in enumerate(indeg) if d==0);seen=0\n    while q:\n        u=q.popleft();seen+=1\n        for v in graph[u]:\n            indeg[v]-=1\n            if indeg[v]==0:q.append(v)\n    return seen==n"},"complexity":"O(V+E) time and space","tests":["No prerequisites","Simple cycle","Disconnected components"]},{"id":"lowest-common-ancestor","title":"Lowest Common Ancestor","difficulty":"Medium","pattern":"Trees","prompt":"Find the lowest common ancestor of two nodes in a binary tree.","constraints":["Nodes exist","A node can be its own ancestor"],"hints":["Return the node when it matches p or q.","If left and right both return non-null, current is LCA."],"solutions":{"Python":"def lca(root,p,q):\n    if not root or root is p or root is q:return root\n    left=lca(root.left,p,q);right=lca(root.right,p,q)\n    if left and right:return root\n    return left or right"},"complexity":"O(n) time, O(h) stack","tests":["One node ancestor of other","Nodes in different subtrees","Skewed tree"]},{"id":"word-search","title":"Word Search","difficulty":"Medium","pattern":"Backtracking","prompt":"Return whether a word can be formed by adjacent cells without reusing a cell.","constraints":["Four directions","Restore state after exploration"],"hints":["Backtrack from each matching start.","Temporarily mark a cell visited."],"solutions":{"Python":"def exist(board,word):\n    R,C=len(board),len(board[0])\n    def dfs(r,c,i):\n        if i==len(word):return True\n        if r<0 or c<0 or r>=R or c>=C or board[r][c]!=word[i]:return False\n        ch=board[r][c];board[r][c]='#'\n        ok=any(dfs(r+dr,c+dc,i+1) for dr,dc in ((1,0),(-1,0),(0,1),(0,-1)))\n        board[r][c]=ch;return ok\n    return any(dfs(r,c,0) for r in range(R) for c in range(C))"},"complexity":"O(RC·4^L) worst case, O(L) stack","tests":["Single cell","Reuse prohibited","Impossible prefix"]},{"id":"house-robber","title":"House Robber","difficulty":"Medium","pattern":"Dynamic Programming","prompt":"Maximize nonadjacent values in an array.","constraints":["Values nonnegative","Return 0 for empty"],"hints":["Track best including up to previous positions.","Only two prior states are needed."],"solutions":{"Python":"def rob(nums):\n    prev2=prev1=0\n    for x in nums: prev2,prev1=prev1,max(prev1,prev2+x)\n    return prev1"},"complexity":"O(n) time, O(1) space","tests":["[] → 0","[2,7,9,3,1] → 12","Single house"]},{"id":"longest-increasing-subsequence","title":"Longest Increasing Subsequence","difficulty":"Medium","pattern":"Dynamic Programming","prompt":"Return the length of the longest strictly increasing subsequence.","constraints":["Subsequence need not be contiguous","Strictly increasing"],"hints":["Start with O(n²) DP.","Advanced: maintain smallest tail per length."],"solutions":{"Python":"from bisect import bisect_left\ndef lis(nums):\n    tails=[]\n    for x in nums:\n        i=bisect_left(tails,x)\n        if i==len(tails):tails.append(x)\n        else:tails[i]=x\n    return len(tails)"},"complexity":"O(n log n) time, O(n) space","tests":["Duplicates","Decreasing input","Empty input"]},{"id":"median-stream","title":"Median from Data Stream","difficulty":"Hard","pattern":"Two Heaps","prompt":"Support adding numbers and returning the median.","constraints":["Balance heap sizes","Handle even count"],"hints":["Max-heap lower half; min-heap upper half.","Keep size difference at most one."],"solutions":{"Python":"import heapq\nclass MedianFinder:\n    def __init__(self):self.low=[];self.high=[]\n    def add(self,x):\n        heapq.heappush(self.low,-x)\n        heapq.heappush(self.high,-heapq.heappop(self.low))\n        if len(self.high)>len(self.low):heapq.heappush(self.low,-heapq.heappop(self.high))\n    def median(self):\n        return -self.low[0] if len(self.low)>len(self.high) else (-self.low[0]+self.high[0])/2"},"complexity":"O(log n) add, O(1) median, O(n) space","tests":["Odd count","Even count","Negative numbers"]},{"id":"sql-retention","title":"Weekly User Retention","difficulty":"Hard","pattern":"SQL Analytics","prompt":"Compute weekly cohort retention from signup and activity tables.","constraints":["Define cohort week","Count distinct active users"],"hints":["Build cohort membership first.","Join activity and calculate week offset."],"solutions":{"SQL":"WITH cohorts AS (\n SELECT user_id, DATE_TRUNC('week', signed_up_at) cohort_week FROM users\n), activity_weeks AS (\n SELECT DISTINCT user_id, DATE_TRUNC('week', occurred_at) activity_week FROM events\n), retained AS (\n SELECT c.cohort_week,\n        EXTRACT(DAY FROM (a.activity_week-c.cohort_week))/7 AS week_number,\n        COUNT(DISTINCT c.user_id) active_users\n FROM cohorts c JOIN activity_weeks a USING(user_id)\n WHERE a.activity_week>=c.cohort_week\n GROUP BY 1,2\n)\nSELECT * FROM retained ORDER BY cohort_week,week_number;"},"complexity":"Plan dependent; indexes on user/time fields help","tests":["Duplicate events","No later activity","Timezone boundaries"]},{"id":"sql-running-total","title":"Running Account Balance","difficulty":"Medium","pattern":"SQL Window Function","prompt":"Compute a running balance per account ordered deterministically.","constraints":["Tie-break equal timestamps","Partition by account"],"hints":["SUM over an ordered window.","Use ROWS rather than default RANGE when needed."],"solutions":{"SQL":"SELECT account_id, transaction_id, occurred_at, amount,\n SUM(amount) OVER (PARTITION BY account_id ORDER BY occurred_at, transaction_id ROWS UNBOUNDED PRECEDING) AS balance\nFROM transactions;"},"complexity":"Sort/window cost depends on plan","tests":["Same timestamp","Multiple accounts","Negative amounts"]},{"id":"api-pagination","title":"Design Cursor Pagination","difficulty":"Practical","pattern":"Backend API","prompt":"Design cursor pagination for a frequently changing feed.","constraints":["Stable ordering","No duplicates or missing rows across pages"],"hints":["Use a compound sort key.","Encode the last seen values in an opaque cursor."],"solutions":{"Architecture":"Order by (created_at DESC, id DESC). Cursor encodes the final row's created_at and id. Next query uses WHERE (created_at,id) < (:time,:id), same ORDER BY, LIMIT n+1. Sign or encrypt cursors if tampering matters. Return next_cursor only when more rows exist. Define behavior for deleted rows and snapshot consistency."},"complexity":"O(page size) result processing; index supports seek","tests":["Equal timestamps","Deleted item","New items inserted between requests"]},{"id":"idempotent-payment","title":"Idempotent Payment Endpoint","difficulty":"Practical","pattern":"Backend Reliability","prompt":"Design an endpoint that safely handles client retries without double charging.","constraints":["Concurrent duplicate requests","Payload mismatch under same key"],"hints":["Persist key and result atomically.","Use a unique constraint and operation state."],"solutions":{"Architecture":"Validate caller and request. Begin transaction. Insert (merchant_id,idempotency_key,payload_hash,status=processing) under a unique constraint. If existing completed row with same hash, return stored response. If hash differs, return conflict. Execute provider call with its own idempotency token where supported. Persist result and commit. Reconciliation handles unknown outcomes. Define TTL and retry response for in-progress operations."},"complexity":"Coordination dominates; lookup should be indexed","tests":["Concurrent same key","Provider timeout after charge","Same key different payload"]},{"id":"react-render-debug","title":"Debug Excessive React Renders","difficulty":"Practical","pattern":"Frontend Debugging","prompt":"A large list rerenders on every keystroke and feels sluggish. Explain how you investigate and improve it.","constraints":["Measure first","Preserve correctness and accessibility"],"hints":["Use profiler to identify actual render cost.","Separate state and stabilize props only where useful."],"solutions":{"Approach":"1. Reproduce with production-sized data and profile. 2. Identify whether filtering, parent state, unstable object/function props, or list DOM size dominates. 3. Move input state closer to the input or split components. 4. Memoize expensive derived filtering only if measured. 5. Stabilize props where memoization benefits. 6. Virtualize very large lists. 7. Debounce remote requests, not local keystrokes by default. 8. Add interaction/performance regression tests."},"complexity":"Depends on list size and rendering cost","tests":["Small list baseline","10k rows","Remote search race"]},{"id":"accessible-modal","title":"Accessible Modal","difficulty":"Practical","pattern":"Frontend Accessibility","prompt":"Design an accessible modal dialog component.","constraints":["Keyboard only operation","Screen reader support","Restore focus"],"hints":["Use native dialog where support fits or implement dialog semantics.","Trap focus and close on Escape when appropriate."],"solutions":{"Approach":"Use semantic dialog behavior, accessible name/description, initial focus, contained tab order, Escape handling, focus restoration to the trigger, background inertness, scroll management, and clear close controls. Do not close destructive flows unexpectedly. Test keyboard, screen reader announcements, zoom, and nested interactive content."},"complexity":"UI behavior, not algorithmic complexity","tests":["Keyboard-only","Screen reader","Trigger removed before close"]},{"id":"worker-pool","title":"Bounded Worker Pool","difficulty":"Medium","pattern":"Concurrency","prompt":"Process jobs concurrently with a fixed worker count and cooperative cancellation.","constraints":["Bound queue growth","Return or record errors"],"hints":["Use a queue and worker tasks.","Stop accepting work during shutdown."],"solutions":{"Python":"from concurrent.futures import ThreadPoolExecutor, as_completed\ndef run_jobs(jobs, worker, max_workers=4):\n    results=[]\n    with ThreadPoolExecutor(max_workers=max_workers) as ex:\n        futures=[ex.submit(worker,j) for j in jobs]\n        for f in as_completed(futures): results.append(f.result())\n    return results"},"complexity":"O(n) scheduling plus work; O(n) futures in this simple version","tests":["Worker raises","Cancellation","Slow job"]},{"id":"deadlock-diagnosis","title":"Deadlock Diagnosis","difficulty":"Practical","pattern":"Concurrency Debugging","prompt":"Two services freeze under load while CPU stays low. Thread dumps show opposing lock acquisition. Diagnose and prevent recurrence.","constraints":["Preserve dump evidence","Avoid merely increasing timeouts"],"hints":["Draw wait-for relationships.","Establish a global lock order."],"solutions":{"Approach":"Confirm threads are blocked and identify lock A→B versus B→A cycles. Mitigate by reducing traffic or restarting safely. Fix by enforcing one lock acquisition order, reducing lock scope, combining locks, using try-lock/timeouts where appropriate, or redesigning ownership/message passing. Add stress tests, lock metrics, and static/code-review rules."},"complexity":"Diagnostic task","tests":["Rare high-load reproduction","Partial stack dump","One lock held across I/O"]},{"id":"design-chat","title":"Design Real-Time Chat","difficulty":"System Design","pattern":"Distributed Systems","prompt":"Design one-to-one and group chat with online delivery, history, receipts, and multi-device users.","constraints":["Ordering expectations","Offline delivery","Large groups"],"hints":["Separate durable message storage from connection delivery.","Use per-conversation sequence or server timestamps carefully."],"solutions":{"Architecture":"Clients connect through WebSocket gateways. Auth maps connection to user/device. Message service validates membership, allocates conversation ordering metadata, writes durably, then publishes delivery events. Gateways fan out to online devices; offline users retrieve from sync API/push notifications. Store conversation membership and messages partitioned by conversation. Add dedupe IDs, delivery/read receipts, retry handling, abuse controls, encryption choices, and backpressure."},"complexity":"Scale depends on connections and fanout","tests":["Reconnect and replay","Duplicate send","10k-member group"]},{"id":"design-notifications","title":"Design Notification Service","difficulty":"System Design","pattern":"Distributed Systems","prompt":"Design email, SMS, push, and in-app notifications with preferences and retries.","constraints":["At-least-once providers","User preferences","Priority and rate limits"],"hints":["Create a canonical notification command.","Separate orchestration from channel providers."],"solutions":{"Architecture":"API validates template/event and writes an outbox record. Orchestrator resolves preferences, locale, dedupe, schedule, and channel plan. Channel queues feed provider adapters. Consumers are idempotent, use bounded retries, dead-letter queues, and provider circuit breakers. Track states and webhooks. Respect quiet hours, unsubscribe, compliance, and priority. Provide dashboards for latency, failure, and suppression."},"complexity":"Queue and provider dependent","tests":["Provider outage","Duplicate webhook","Preference changed after enqueue"]},{"id":"design-file-storage","title":"Design File Storage & Sharing","difficulty":"System Design","pattern":"Architecture","prompt":"Design upload, download, sharing, versioning, and malware scanning.","constraints":["Large multipart uploads","Private access","Global downloads"],"hints":["Use object storage and signed URLs.","Keep metadata separate from bytes."],"solutions":{"Architecture":"Metadata service manages owners, ACLs, versions, hashes, and status. Client obtains multipart signed-upload URLs, uploads directly to object storage, then finalizes. Async pipeline verifies checksum, scans malware, extracts metadata, and marks available. Downloads use authorization then short-lived signed URL/CDN. Add encryption, retention, audit logs, quotas, resumability, dedupe policy, and deletion workflow."},"complexity":"Object operations dominate","tests":["Interrupted upload","Malware found","Revoked share link"]},{"id":"design-job-queue","title":"Design Distributed Job Queue","difficulty":"System Design","pattern":"Distributed Systems","prompt":"Design delayed and immediate jobs with retries, leasing, and worker scaling.","constraints":["At-least-once delivery","Worker crashes","Priority and delay"],"hints":["Use leases/visibility timeouts.","Make handlers idempotent."],"solutions":{"Architecture":"Producers persist jobs with payload reference, schedule time, priority, attempts, and dedupe key. Brokers partition ready queues. Workers lease jobs; heartbeat extends lease. Success acknowledges; failure applies bounded retry and dead-letter policy. Scheduler promotes delayed jobs. Autoscale on queue age and depth. Include poison-message tooling, payload limits, tenant fairness, observability, and replay controls."},"complexity":"Broker dependent","tests":["Worker dies mid-job","Poison job","Hot tenant"]},{"id":"security-review","title":"API Security Review","difficulty":"Practical","pattern":"Security","prompt":"Review a file-sharing API for common security flaws.","constraints":["Assume hostile clients","Protect metadata and content"],"hints":["Check authorization on every object access.","Review upload validation and signed URL scope."],"solutions":{"Approach":"Review authentication, object-level authorization, tenant isolation, input validation, content-type and extension mismatch, malware scanning, path/key injection, signed URL scope/TTL, rate limits, CSRF where cookies are used, audit logs, secret handling, encryption, dependency risk, error leakage, and deletion/retention. Add abuse cases and negative authorization tests."},"complexity":"Threat-modeling task","tests":["IDOR attempt","Oversized upload","Expired signed URL"]},{"id":"docker-debug","title":"Container Starts Then Exits","difficulty":"Practical","pattern":"DevOps Debugging","prompt":"A container exits immediately in production but works interactively. Investigate.","constraints":["Use logs and inspect config","Do not rebuild blindly"],"hints":["Check entrypoint and foreground process.","Compare environment, mounts, user, and architecture."],"solutions":{"Approach":"Inspect exit code, stdout/stderr, entrypoint/CMD, image architecture, working directory, environment variables, mounted files, permissions, non-root user, health checks, and signals. Reproduce with the exact image/config. Ensure the main process remains foreground and receives signals. Validate config at startup and add a smoke test in CI."},"complexity":"Diagnostic task","tests":["Missing secret","Wrong CPU architecture","Shell script CRLF"]},{"id":"git-bisect","title":"Find Regression with Git Bisect","difficulty":"Practical","pattern":"Git","prompt":"Use binary search over commits to locate a regression.","constraints":["Known good and bad commits","Automate test where possible"],"hints":["git bisect start; mark bad and good.","Run test and classify each midpoint."],"solutions":{"Bash":"git bisect start\ngit bisect bad HEAD\ngit bisect good <known-good>\ngit bisect run ./repro-test.sh\n# inspect first bad commit\ngit bisect reset"},"complexity":"O(log n) tested commits","tests":["Flaky test","Build failure","Bad commit is merge"]},{"id":"python-iterator","title":"Custom Python Iterator","difficulty":"Medium","pattern":"Python","prompt":"Implement an iterator that yields lines from multiple files lazily and closes resources safely.","constraints":["Do not load all files","Handle exceptions and early termination"],"hints":["Use a generator and context management.","Open one file at a time."],"solutions":{"Python":"def iter_lines(paths):\n    for path in paths:\n        with open(path, encoding='utf-8') as f:\n            for line in f:\n                yield line.rstrip('\\n')"},"complexity":"O(total bytes) time, O(1) extra memory excluding line buffer","tests":["Empty file","Read error","Consumer stops early"]},{"id":"typescript-narrowing","title":"TypeScript Discriminated Union","difficulty":"Medium","pattern":"TypeScript","prompt":"Model API result states so every case is handled exhaustively.","constraints":["No unsafe casts","Compiler should detect missing cases"],"hints":["Use a shared discriminant field.","Use never in the default branch."],"solutions":{"TypeScript":"type Result =\n | { kind: 'loading' }\n | { kind: 'success'; data: string[] }\n | { kind: 'error'; message: string };\nfunction render(r: Result): string {\n switch (r.kind) {\n  case 'loading': return 'Loading';\n  case 'success': return r.data.join(', ');\n  case 'error': return r.message;\n  default: { const _never: never = r; return _never; }\n }\n}"},"complexity":"O(n) only for success join","tests":["All variants","Add new variant causes compile error"]},{"id":"java-lru","title":"Java LRU Cache","difficulty":"Medium","pattern":"Java Collections","prompt":"Implement an LRU cache using an appropriate standard collection.","constraints":["O(1) average operations","Capacity enforcement"],"hints":["LinkedHashMap supports access order.","Override removeEldestEntry."],"solutions":{"Java":"class LruCache<K,V> extends java.util.LinkedHashMap<K,V> {\n private final int capacity;\n LruCache(int capacity){ super(capacity,0.75f,true); this.capacity=capacity; }\n @Override protected boolean removeEldestEntry(java.util.Map.Entry<K,V> e){ return size()>capacity; }\n}"},"complexity":"O(1) average get/put","tests":["Update refreshes order","Capacity 1","Missing key"]},{"id":"go-cancellation","title":"Go Request Cancellation","difficulty":"Medium","pattern":"Go Concurrency","prompt":"Implement worker calls that stop when the request context is canceled.","constraints":["No goroutine leak","Propagate errors"],"hints":["Select on work and ctx.Done().","Pass context into downstream calls."],"solutions":{"Go":"func worker(ctx context.Context, jobs <-chan Job) error {\n for {\n  select {\n  case <-ctx.Done(): return ctx.Err()\n  case job, ok := <-jobs:\n   if !ok { return nil }\n   if err := process(ctx, job); err != nil { return err }\n  }\n }\n}"},"complexity":"O(number of jobs + work)","tests":["Cancel before work","Channel closes","Downstream timeout"]},{"id":"rust-result","title":"Rust Error Propagation","difficulty":"Medium","pattern":"Rust","prompt":"Parse a configuration file and return structured errors without panicking.","constraints":["No unwrap in production path","Preserve error source"],"hints":["Use Result and ?.","Define an error enum or use a typed error crate."],"solutions":{"Rust":"fn load(path: &str) -> Result<Config, ConfigError> {\n let text = std::fs::read_to_string(path).map_err(ConfigError::Io)?;\n let cfg = toml::from_str(&text).map_err(ConfigError::Parse)?;\n validate(&cfg)?;\n Ok(cfg)\n}"},"complexity":"O(file size) time and space","tests":["Missing file","Malformed config","Validation failure"]},{"id":"swift-actor","title":"Swift Actor Counter","difficulty":"Medium","pattern":"Swift Concurrency","prompt":"Use an actor to protect shared mutable state.","constraints":["Async access","No data race"],"hints":["Actor-isolated methods serialize access.","Call with await from outside."],"solutions":{"Swift":"actor Counter {\n private var value = 0\n func increment() { value += 1 }\n func current() -> Int { value }\n}"},"complexity":"O(1) per operation","tests":["Concurrent increments","Read after updates"]},{"id":"kotlin-flow","title":"Kotlin Search Flow","difficulty":"Medium","pattern":"Kotlin Coroutines","prompt":"Build a search stream that debounces input and cancels stale requests.","constraints":["Avoid stale result overwrite","Handle errors"],"hints":["Use debounce and distinctUntilChanged.","flatMapLatest cancels old work."],"solutions":{"Kotlin":"val results = queryFlow\n .debounce(300)\n .distinctUntilChanged()\n .flatMapLatest { q -> repository.search(q).catch { emit(emptyList()) } }"},"complexity":"Depends on request and result size","tests":["Rapid typing","Blank query","Network error"]},{"id":"test-pyramid","title":"Testing Strategy Drill","difficulty":"Practical","pattern":"Testing","prompt":"Create a test strategy for an order checkout service.","constraints":["Fast feedback","Critical integration confidence","Avoid brittle overmocking"],"hints":["Map risks to test levels.","Include contract and failure tests."],"solutions":{"Approach":"Unit-test pricing, validation, and state transitions. Integration-test database transactions, payment adapter contract, and queue/outbox behavior. End-to-end-test a small number of critical checkout paths. Add property tests for totals, negative authorization tests, idempotency tests, concurrency tests, and production synthetic monitoring. Keep deterministic fixtures and isolate provider sandboxes."},"complexity":"Strategy task","tests":["Payment timeout","Duplicate submit","Inventory race"]},{"id":"resume-project-defense","title":"Project Defense Drill","difficulty":"Practical","pattern":"Career","prompt":"Prepare a five-minute architecture defense of one portfolio project.","constraints":["Be exact about personal contribution","Include failures and tradeoffs"],"hints":["Use problem → architecture → decisions → results.","Prepare ten probing follow-ups."],"solutions":{"Approach":"Outline: user problem and scale; your role; architecture and request flow; data model; hardest decision and alternatives; testing; deployment; observability; security; measurable result; failure/lesson; what you would redesign. Prepare evidence for every resume claim."},"complexity":"Communication task","tests":["Why this stack?","What breaks at 10×?","What did you personally build?"]}],"behavioral":["Tell me about yourself as an engineer.","Describe a difficult bug you solved.","Tell me about a time you failed.","Describe a conflict with a teammate.","Tell me about a time requirements were ambiguous.","Describe a decision you made with incomplete information.","Tell me about a time you received difficult feedback.","Describe a time you improved code quality.","Tell me about a time you missed an estimate.","Describe a time you took ownership beyond your assigned task.","Tell me about a time you disagreed with a technical direction.","Describe a time you learned a new technology quickly.","Tell me about a time you protected users or data.","Describe a time you balanced speed and quality.","Tell me about a time you simplified a complex system.","Describe a time a customer or user changed your approach.","Tell me about a time you helped a teammate succeed.","Describe a time you had to say no or push back.","Tell me about your most technically challenging project.","Why are you interested in this role?","Why should we hire you?","What kind of team helps you do your best work?","What is an area you are actively improving?","Describe a time you handled a production incident.","Tell me about a time you prevented a problem before it reached users.","Describe a time you changed your mind after seeing evidence.","Tell me about a time you had to learn an unfamiliar codebase.","Describe a time you improved developer experience.","Tell me about a time you made a difficult prioritization decision.","Describe a time you challenged an unsafe or insecure shortcut.","Tell me about a time your first solution was wrong.","Describe a time you influenced without formal authority.","Tell me about a time you handled competing stakeholder needs.","Describe a time you reduced operational risk."],"systems":["Design a URL shortener.","Design a notification service.","Design a file upload and sharing system.","Design a real-time chat service.","Design an API rate limiter.","Design a job queue.","Design a metrics collection platform.","Design a social feed.","Design a ride dispatch service.","Design a feature-flag service.","Design a parking-lot object model.","Design a library-management system.","Design an autocomplete service.","Design a payment-processing workflow.","Design a log search system.","Design a real-time collaborative editor.","Design a secrets-management service.","Design an image-processing pipeline.","Design a multi-tenant SaaS authorization system.","Design an online code execution platform.","Design a package registry.","Design a distributed scheduler.","Design an audit-log platform."],"technical":["Explain value versus reference semantics.","Explain how a hash table works and discuss collisions.","Compare processes and threads.","Explain the event loop.","Explain database indexes.","Compare REST and GraphQL.","Explain optimistic versus pessimistic locking.","Describe how TLS protects an HTTP connection.","Explain garbage collection.","Compare a heap and a balanced tree.","Explain idempotency.","Describe how you would debug a memory leak.","Explain eventual consistency.","Compare horizontal and vertical scaling.","Explain dependency injection.","Describe unit, integration, and end-to-end testing.","Explain SQL isolation levels.","Compare authentication and authorization.","Explain deadlock and prevention.","Describe safe retry behavior.","Explain browser rendering and layout.","Explain cursor versus offset pagination.","Compare at-least-once and exactly-once processing.","Explain cache stampede prevention.","Describe structured concurrency.","Explain database connection pooling.","Compare optimistic UI and server-confirmed UI.","Explain data lineage and reconciliation.","Describe a zero-downtime database migration.","Explain graceful degradation."],"weeks":[["Weeks 1–2","Interview process, CLEAR framework, programming and memory fundamentals"],["Weeks 3–4","Complexity, arrays, strings, hashing, two pointers"],["Weeks 5–6","Linked lists, stacks, queues, binary search, sorting"],["Weeks 7–8","Trees, heaps, tries, graph traversal"],["Weeks 9–10","Backtracking, dynamic programming, mixed coding drills"],["Weeks 11–12","SQL, schema design, transactions, indexing"],["Weeks 13–14","HTTP, APIs, authentication, backend reliability"],["Weeks 15–16","Operating systems, networking, concurrency, security"],["Weeks 17–18","System design and architecture tradeoffs"],["Weeks 19–20","Cloud, Linux, CI/CD, observability"],["Weeks 21–22","Primary language track and AI-assisted engineering"],["Weeks 23–24","Behavioral stories, project defense, full mock loops"],["Weeks 25–26","Frontend, backend, mobile, and data specialization tracks"],["Weeks 27–29","Dedicated Java, C#, C++/Go/Rust language deep dives"],["Weeks 30–31","Advanced system design, incidents, and behavioral mastery"],["Week 32","Algorithms checkpoint and complete final interview loop"]]};
const STORAGE_KEY = 'teqvault-se-interview-course-v1';
const defaultState = {completed:[], quizScores:{}, labComplete:[], notes:{}, star:{}, readiness:{}, mocks:[], theme:'dark'};
let state = loadState();
let currentView = {type:'dashboard'};
let timerInterval = null, timerSeconds = 45 * 60, timerRunning = false;

function loadState(){try{return {...defaultState,...JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}}catch{return {...defaultState}}}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));updateProgress()}
function escapeHtml(value=''){return value.replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[ch]))}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function setTheme(theme){state.theme=theme;document.documentElement.dataset.theme=theme==='light'?'light':'';saveState()}
function scoreTotal(){return Object.values(state.quizScores).reduce((sum,s)=>sum+(s.score||0),0)}
function totalQuiz(){return COURSE.modules.reduce((sum,m)=>sum+m.quiz.length,0)}
function updateProgress(){
  const lessonPoints=state.completed.length;
  const quizPoints=Object.keys(state.quizScores).length;
  const labPoints=state.labComplete.length;
  const readinessPoints=Object.values(state.readiness).filter(Boolean).length;
  const total=COURSE.modules.length+COURSE.modules.length+COURSE.labs.length+readinessItems.length;
  const done=lessonPoints+quizPoints+labPoints+readinessPoints;
  const pct=Math.round(done/total*100);
  document.getElementById('progressText').textContent=pct+'%';document.getElementById('progressFill').style.width=pct+'%';
}
function buildNav(){
  const nav=document.getElementById('moduleNav');let html='';let phase='';
  COURSE.modules.forEach((m,i)=>{if(m.phase!==phase){phase=m.phase;html+=`<div class="nav-group">${phase}</div>`}html+=`<button class="nav-btn" data-module="${m.id}"><span class="nav-num">${String(i+1).padStart(2,'0')}</span><span>${m.title.replace(/^\d+\.\s*/,'')}</span></button>`});
  nav.innerHTML=html;
}
function setActive(selector,value){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));const btn=document.querySelector(`[${selector}="${value}"]`);if(btn)btn.classList.add('active')}
function navigate(view){
  currentView=view;window.scrollTo({top:0,behavior:'smooth'});document.getElementById('sidebar').classList.remove('open');
  if(view.type==='dashboard'){renderDashboard();setActive('data-view','dashboard')}
  if(view.type==='module'){renderModule(view.id);setActive('data-module',view.id)}
  if(view.type==='quiz'){renderQuiz(view.id,0,0);setActive('data-module',view.id)}
  if(view.type==='labs'){renderLabs();setActive('data-view','labs')}
  if(view.type==='lab'){renderLab(view.id);setActive('data-view','labs')}
  if(view.type==='bank'){renderBank();setActive('data-view','bank')}
  if(view.type==='behavioral'){renderBehavioral();setActive('data-view','behavioral')}
  if(view.type==='mock'){renderMock();setActive('data-view','mock')}
  if(view.type==='readiness'){renderReadiness();setActive('data-view','readiness')}
}
function renderDashboard(){
 const c=document.getElementById('content');
 const avg=Object.keys(state.quizScores).length?Math.round(Object.values(state.quizScores).reduce((s,x)=>s+(x.percent||0),0)/Object.keys(state.quizScores).length):0;
 c.innerHTML=`<section class="hero"><div class="eyebrow">32-week flagship job-readiness program</div><h2>Software Engineering Interview Mastery</h2><p>Train the full interview loop with deep lessons, dedicated language and role tracks, coding patterns, SQL, frontend/backend engineering, production debugging, system design, behavioral storytelling, project defense, and realistic mock interviews.</p><div class="hero-actions"><button class="primary" data-open-first>Start / Continue Course</button><button class="secondary" data-view="mock">Launch Mock Interview</button><button class="secondary" onclick="window.print()">Print Current View</button></div></section>
 <div class="grid stats-grid"><div class="card stat"><strong>${state.completed.length}/${COURSE.modules.length}</strong><span>Lessons completed</span></div><div class="card stat"><strong>${scoreTotal()}/${totalQuiz()}</strong><span>Quiz questions correct</span></div><div class="card stat"><strong>${state.labComplete.length}/${COURSE.labs.length}</strong><span>Coding labs completed</span></div><div class="card stat"><strong>${avg}%</strong><span>Average module score</span></div></div>
 <div class="section-title"><div><h3>Your 32-week roadmap</h3><p>Eight to twelve focused hours per week.</p></div></div><div class="grid week-grid">${COURSE.weeks.map(w=>`<div class="card week-card"><strong>${w[0]}</strong><p>${w[1]}</p></div>`).join('')}</div>
 <div class="section-title"><div><h3>Interview operating rules</h3><p>The habits that separate prepared candidates from memorization-only candidates.</p></div></div>
 <div class="grid week-grid"><div class="card"><h3>Clarify before coding</h3><p>Restate inputs, outputs, constraints, failure behavior, and examples. Make assumptions visible.</p></div><div class="card"><h3>Explain the invariant</h3><p>State what remains true while the algorithm runs. This keeps code and reasoning aligned.</p></div><div class="card"><h3>Test before declaring victory</h3><p>Use empty, minimal, duplicate, boundary, invalid, and scale cases. Then state complexity.</p></div></div>`;
 bindViewButtons();document.querySelector('[data-open-first]').onclick=()=>{const next=COURSE.modules.find(m=>!state.completed.includes(m.id))||COURSE.modules[0];navigate({type:'module',id:next.id})}
}
function renderModule(id){
 const m=COURSE.modules.find(x=>x.id===id);if(!m)return;
 const completed=state.completed.includes(id);const score=state.quizScores[id];
 document.getElementById('content').innerHTML=`<article><div class="module-head"><div><div class="eyebrow">${m.phase}</div><h2>${m.title}</h2><div class="badges"><span class="badge accent">${m.level}</span><span class="badge">${m.duration}</span>${score?`<span class="badge">Quiz ${score.percent}%</span>`:''}</div></div><button class="${completed?'secondary':'primary'}" id="completeBtn">${completed?'✓ Completed':'Mark lesson complete'}</button></div>
 <div class="grid objectives">${m.objectives.map(o=>`<div class="card objective"><span class="tick">✓</span><span>${o}</span></div>`).join('')}</div>
 ${m.sections.map(s=>`<section class="card lesson-section"><h3>${s[0]}</h3>${s[1]}</section>`).join('')}
 <div class="card callout interviewer"><strong>Interviewer’s lens</strong><div>${m.interviewer}</div></div>
 <div class="card"><h3>Practice assignment</h3><p>${m.exercise}</p></div>
 <div class="module-actions"><button class="primary" id="quizBtn">Take module quiz</button><button class="secondary" data-view="labs">Open coding labs</button><button class="secondary" id="nextModule">Next lesson →</button></div>
 <div class="card notes"><h3>Private lesson notes</h3><textarea id="noteArea" placeholder="Save your own examples, questions, and interview stories…">${escapeHtml(state.notes[id]||'')}</textarea><div class="module-actions"><button class="secondary" id="saveNote">Save notes</button></div></div></article>`;
 document.getElementById('completeBtn').onclick=()=>{state.completed=completed?state.completed.filter(x=>x!==id):[...state.completed,id];saveState();renderModule(id);toast(completed?'Completion removed':'Lesson completed')};
 document.getElementById('quizBtn').onclick=()=>navigate({type:'quiz',id});
 document.getElementById('saveNote').onclick=()=>{state.notes[id]=document.getElementById('noteArea').value;saveState();toast('Notes saved')};
 document.getElementById('nextModule').onclick=()=>{const idx=COURSE.modules.findIndex(x=>x.id===id);navigate({type:'module',id:COURSE.modules[(idx+1)%COURSE.modules.length].id})};bindViewButtons();
}
function renderQuiz(id,index,correct,answers=[]){
 const m=COURSE.modules.find(x=>x.id===id), q=m.quiz[index];
 if(!q){const pct=Math.round(correct/m.quiz.length*100);state.quizScores[id]={score:correct,total:m.quiz.length,percent:pct};saveState();document.getElementById('content').innerHTML=`<div class="card quiz-shell"><div class="eyebrow">Module quiz complete</div><h2>${m.title}</h2><div class="timer">${pct}%</div><p>You answered <strong>${correct}</strong> of ${m.quiz.length} correctly.</p><div class="module-actions"><button class="primary" id="backLesson">Return to lesson</button><button class="secondary" id="retryQuiz">Retry quiz</button></div></div>`;document.getElementById('backLesson').onclick=()=>navigate({type:'module',id});document.getElementById('retryQuiz').onclick=()=>renderQuiz(id,0,0,[]);return}
 document.getElementById('content').innerHTML=`<div class="card quiz-shell"><div class="quiz-meta"><span>${m.title}</span><span>Question ${index+1} of ${m.quiz.length}</span></div><div class="progress-track"><div class="progress-fill" style="width:${index/m.quiz.length*100}%"></div></div><div class="quiz-question">${q[0]}</div><div class="choices">${q[1].map((choice,i)=>`<button class="choice" data-choice="${i}">${choice}</button>`).join('')}</div><div id="quizFeedback"></div></div>`;
 document.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>{const selected=Number(btn.dataset.choice);document.querySelectorAll('[data-choice]').forEach((b,i)=>{b.disabled=true;if(i===q[2])b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});const good=selected===q[2];document.getElementById('quizFeedback').innerHTML=`<div class="explanation"><strong>${good?'Correct':'Not quite'}.</strong> ${q[3]}</div><div class="module-actions"><button class="primary" id="nextQuestion">${index===m.quiz.length-1?'Finish quiz':'Next question'}</button></div>`;document.getElementById('nextQuestion').onclick=()=>renderQuiz(id,index+1,correct+(good?1:0),[...answers,selected])})
}
function renderLabs(){
 document.getElementById('content').innerHTML=`<div class="module-head"><div><div class="eyebrow">Practice environment</div><h2>Coding & Design Labs</h2><p>Work aloud, write your own solution in the scratchpad, then compare with the reference answer.</p></div></div><div class="filters"><select id="labDifficulty"><option value="all">All difficulties</option>${[...new Set(COURSE.labs.map(l=>l.difficulty))].map(x=>`<option>${x}</option>`).join('')}</select><select id="labPattern"><option value="all">All patterns</option>${[...new Set(COURSE.labs.map(l=>l.pattern))].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="grid lab-list" id="labList"></div>`;
 const draw=()=>{const d=document.getElementById('labDifficulty').value,p=document.getElementById('labPattern').value;const items=COURSE.labs.filter(l=>(d==='all'||l.difficulty===d)&&(p==='all'||l.pattern===p));document.getElementById('labList').innerHTML=items.map(l=>`<div class="card lab-card"><div class="badges"><span class="pill">${l.difficulty}</span><span class="pill">${l.pattern}</span>${state.labComplete.includes(l.id)?'<span class="pill">✓ Complete</span>':''}</div><h3>${l.title}</h3><p>${l.prompt}</p><button class="secondary" data-lab="${l.id}">Open lab</button></div>`).join('');document.querySelectorAll('[data-lab]').forEach(b=>b.onclick=()=>navigate({type:'lab',id:b.dataset.lab}))};
 document.getElementById('labDifficulty').onchange=draw;document.getElementById('labPattern').onchange=draw;draw();
}
function renderLab(id){
 const l=COURSE.labs.find(x=>x.id===id);const langs=Object.keys(l.solutions);const complete=state.labComplete.includes(id);
 document.getElementById('content').innerHTML=`<div class="lab-detail"><div class="eyebrow">${l.difficulty} · ${l.pattern}</div><h2>${l.title}</h2><div class="card"><h3>Prompt</h3><p>${l.prompt}</p><h4>Constraints</h4><ul>${l.constraints.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><h3>Your interview scratchpad</h3><textarea class="scratchpad" id="scratchpad" placeholder="Clarifying questions, approach, code, tests, and complexity…">${escapeHtml(state.notes['lab-'+id]||'')}</textarea><div class="module-actions"><button class="secondary" id="saveScratch">Save scratchpad</button><button class="secondary" id="showHint">Reveal next hint</button></div><div id="hints">${l.hints.map((h,i)=>`<div class="hint" data-hint="${i}"><strong>Hint ${i+1}:</strong> ${h}</div>`).join('')}</div></div><div class="card"><button class="primary" id="showSolution">Reveal reference solution</button><div class="solution-box" id="solutionBox"><div class="solution-tabs">${langs.map((x,i)=>`<button class="solution-tab ${i===0?'active':''}" data-lang="${x}">${x}</button>`).join('')}</div><pre><code id="solutionCode">${escapeHtml(l.solutions[langs[0]])}</code></pre><p><strong>Complexity:</strong> ${l.complexity}</p><h4>Test cases</h4><ul>${l.tests.map(t=>`<li>${t}</li>`).join('')}</ul></div></div><div class="module-actions"><button class="${complete?'secondary':'primary'}" id="labComplete">${complete?'✓ Lab completed':'Mark lab complete'}</button><button class="secondary" data-view="labs">← All labs</button></div></div>`;
 let hintIndex=0;document.getElementById('showHint').onclick=()=>{const hint=document.querySelector(`[data-hint="${hintIndex}"]`);if(hint){hint.style.display='block';hintIndex++}else toast('All hints revealed')};document.getElementById('showSolution').onclick=()=>document.getElementById('solutionBox').style.display='block';document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-lang]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('solutionCode').textContent=l.solutions[b.dataset.lang]});document.getElementById('saveScratch').onclick=()=>{state.notes['lab-'+id]=document.getElementById('scratchpad').value;saveState();toast('Scratchpad saved')};document.getElementById('labComplete').onclick=()=>{state.labComplete=complete?state.labComplete.filter(x=>x!==id):[...state.labComplete,id];saveState();renderLab(id);toast(complete?'Completion removed':'Lab completed')};bindViewButtons();
}
function allQuestions(){return COURSE.modules.flatMap(m=>m.quiz.map(q=>({module:m.title,question:q[0],answer:q[1][q[2]],explanation:q[3]})))}
function renderBank(query=''){
 const questions=allQuestions().filter(q=>(q.question+' '+q.answer+' '+q.module).toLowerCase().includes(query.toLowerCase()));
 document.getElementById('content').innerHTML=`<div class="module-head"><div><div class="eyebrow">120 solved questions</div><h2>Technical Question Bank</h2><p>Use these as flashcards. Answer aloud before opening the solution.</p></div></div><div class="filters"><input id="bankSearch" placeholder="Filter the question bank…" value="${escapeHtml(query)}"></div><div class="question-bank">${questions.map((q,i)=>`<div class="qa"><button data-qa="${i}"><span><small>${q.module}</small><br>${q.question}</span><span>＋</span></button><div class="qa-answer"><strong>Answer:</strong> ${q.answer}<br><br>${q.explanation}</div></div>`).join('')||'<div class="empty">No matching questions.</div>'}</div>`;
 document.getElementById('bankSearch').oninput=e=>renderBank(e.target.value);document.querySelectorAll('[data-qa]').forEach(b=>b.onclick=()=>b.closest('.qa').classList.toggle('open'));
}
function renderBehavioral(){
 const selected=COURSE.behavioral[0];
 document.getElementById('content').innerHTML=`<div class="module-head"><div><div class="eyebrow">STAR-R answer builder</div><h2>Behavioral Interview Studio</h2><p>Create concise, evidence-based stories and save them locally.</p></div></div><div class="card"><label for="behaviorQuestion"><strong>Interview question</strong></label><select class="star-select" id="behaviorQuestion">${COURSE.behavioral.map(q=>`<option>${q}</option>`).join('')}</select></div><div class="grid star-grid" id="starFields"></div><div class="module-actions"><button class="primary" id="saveStar">Save answer</button><button class="secondary" id="clearStar">Clear fields</button></div><div class="card"><h3>Answer preview</h3><div class="star-preview" id="starPreview">Begin filling the fields above.</div></div>`;
 const labels=[['situation','Situation','Give only the context needed to understand the problem.'],['task','Task','What were you personally responsible for?'],['action','Action','What decisions and steps did you personally take?'],['result','Result','What measurable or observable outcome followed?'],['reflection','Reflection','What did you learn and change afterward?']];
 function draw(){const q=document.getElementById('behaviorQuestion').value;const saved=state.star[q]||{};document.getElementById('starFields').innerHTML=labels.map(([key,label,ph])=>`<div class="card star-card"><label>${label}</label><textarea data-star="${key}" placeholder="${ph}">${escapeHtml(saved[key]||'')}</textarea></div>`).join('');document.querySelectorAll('[data-star]').forEach(t=>t.oninput=preview);preview()}
 function preview(){const values={};document.querySelectorAll('[data-star]').forEach(t=>values[t.dataset.star]=t.value.trim());document.getElementById('starPreview').textContent=`${document.getElementById('behaviorQuestion').value}\n\nSituation: ${values.situation||'…'}\nTask: ${values.task||'…'}\nAction: ${values.action||'…'}\nResult: ${values.result||'…'}\nReflection: ${values.reflection||'…'}`}
 document.getElementById('behaviorQuestion').onchange=draw;document.getElementById('saveStar').onclick=()=>{const q=document.getElementById('behaviorQuestion').value;const obj={};document.querySelectorAll('[data-star]').forEach(t=>obj[t.dataset.star]=t.value);state.star[q]=obj;saveState();toast('STAR-R answer saved')};document.getElementById('clearStar').onclick=()=>{document.querySelectorAll('[data-star]').forEach(t=>t.value='');preview()};draw();
}
function randomFrom(arr){return arr[Math.floor(Math.random()*arr.length)]}
function renderMock(){
 clearInterval(timerInterval);timerRunning=false;
 document.getElementById('content').innerHTML=`<div class="module-head"><div><div class="eyebrow">Realistic practice</div><h2>Mock Interview Room</h2><p>Choose a round, think aloud, use the timer, and score yourself honestly.</p></div></div><div class="grid mock-grid"><div class="card"><div class="filters"><select id="roundType"><option value="technical">Technical fundamentals</option><option value="coding">Coding</option><option value="system">System design</option><option value="behavioral">Behavioral</option></select><select id="roundLength"><option value="30">30 minutes</option><option value="45" selected>45 minutes</option><option value="60">60 minutes</option></select></div><div class="prompt-box" id="mockPrompt"></div><div class="module-actions"><button class="primary" id="newPrompt">New prompt</button></div><textarea class="scratchpad" id="mockNotes" placeholder="Clarifying questions, answer outline, feedback…"></textarea></div><div class="card"><div class="timer" id="timer">45:00</div><div class="timer-controls"><button class="primary" id="timerStart">Start</button><button class="secondary" id="timerPause">Pause</button><button class="secondary" id="timerReset">Reset</button></div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>Self-scoring rubric</h3><div id="rubric"></div><button class="primary" id="saveMock">Save mock result</button></div></div>`;
 const dimensions=['Clarification','Approach','Correctness','Testing','Communication','Technical depth'];document.getElementById('rubric').innerHTML=dimensions.map(d=>`<div class="rubric-row"><span>${d}</span><input type="range" min="1" max="5" value="3" data-rubric="${d}"><strong data-score="${d}">3</strong></div>`).join('');document.querySelectorAll('[data-rubric]').forEach(r=>r.oninput=()=>document.querySelector(`[data-score="${r.dataset.rubric}"]`).textContent=r.value);
 const choose=()=>{const type=document.getElementById('roundType').value;let prompt;if(type==='technical')prompt=randomFrom(COURSE.technical);if(type==='coding')prompt=randomFrom(COURSE.labs.filter(x=>!['System Design','Practical'].includes(x.difficulty))).prompt;if(type==='system')prompt=randomFrom(COURSE.systems);if(type==='behavioral')prompt=randomFrom(COURSE.behavioral);document.getElementById('mockPrompt').textContent=prompt};
 function updateTimer(){const m=Math.floor(timerSeconds/60),s=timerSeconds%60;document.getElementById('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
 function resetTimer(){clearInterval(timerInterval);timerRunning=false;timerSeconds=Number(document.getElementById('roundLength').value)*60;updateTimer()}
 document.getElementById('newPrompt').onclick=choose;document.getElementById('roundType').onchange=choose;document.getElementById('roundLength').onchange=resetTimer;document.getElementById('timerStart').onclick=()=>{if(timerRunning)return;timerRunning=true;timerInterval=setInterval(()=>{timerSeconds--;updateTimer();if(timerSeconds<=0){clearInterval(timerInterval);timerRunning=false;toast('Time is up')}},1000)};document.getElementById('timerPause').onclick=()=>{clearInterval(timerInterval);timerRunning=false};document.getElementById('timerReset').onclick=resetTimer;document.getElementById('saveMock').onclick=()=>{const scores={};document.querySelectorAll('[data-rubric]').forEach(r=>scores[r.dataset.rubric]=Number(r.value));state.mocks.push({date:new Date().toISOString(),type:document.getElementById('roundType').value,prompt:document.getElementById('mockPrompt').textContent,scores,notes:document.getElementById('mockNotes').value});saveState();toast('Mock result saved')};choose();resetTimer();
}
const readinessItems=['I can solve easy array/hash problems in 20 minutes.','I can solve common medium problems in 35–45 minutes.','I explain invariants before coding.','I test empty, minimal, duplicate, and boundary cases.','I state time and space complexity accurately.','I can write joins, CTEs, and window functions.','I can explain HTTP, authentication, caching, and retries.','I can discuss processes, threads, races, and deadlocks.','I can design a service from requirements through failure modes.','I have twelve practiced STAR-R stories.','I can defend every major claim on my resume.','I can explain two projects at architecture depth.','I can discuss responsible AI-assisted development.','I have completed at least three timed mock interviews.'];
function renderReadiness(){
 document.getElementById('content').innerHTML=`<div class="module-head"><div><div class="eyebrow">Graduation checklist</div><h2>Final Interview Readiness</h2><p>Check an item only when you can demonstrate it consistently without heavy prompting.</p></div></div><div class="grid readiness-grid">${readinessItems.map((item,i)=>`<label class="check-item"><input type="checkbox" data-ready="${i}" ${state.readiness[i]?'checked':''}><span>${item}</span></label>`).join('')}</div><div class="card" style="margin-top:18px"><h3>Recommended graduation standard</h3><p>Complete all core and selected specialization lessons, score at least 80% on every module quiz, finish at least 12 coding labs, prepare twelve STAR-R stories, and average 4/5 across three full mock interviews.</p><div class="module-actions"><button class="secondary" id="exportProgress">Export progress</button><button class="danger" id="resetCourse">Reset all local progress</button></div></div>`;
 document.querySelectorAll('[data-ready]').forEach(c=>c.onchange=()=>{state.readiness[c.dataset.ready]=c.checked;saveState()});document.getElementById('exportProgress').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='interview-course-progress.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('resetCourse').onclick=()=>{if(confirm('Reset all course progress, notes, and saved answers?')){state={...defaultState,theme:state.theme};saveState();navigate({type:'dashboard'});toast('Course reset')}};
}
function bindViewButtons(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate({type:b.dataset.view}))}
function globalSearch(query){
 if(!query.trim()){navigate(currentView);return}
 const q=query.toLowerCase();const moduleMatches=COURSE.modules.filter(m=>JSON.stringify(m).toLowerCase().includes(q));const labMatches=COURSE.labs.filter(l=>JSON.stringify(l).toLowerCase().includes(q));const questionMatches=allQuestions().filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('content').innerHTML=`<div class="module-head"><div><div class="eyebrow">Search results</div><h2>Results for “${escapeHtml(query)}”</h2><p>${moduleMatches.length} lessons · ${labMatches.length} labs · ${questionMatches.length} questions</p></div></div>${moduleMatches.length?`<div class="section-title"><h3>Lessons</h3></div><div class="grid lab-list">${moduleMatches.map(m=>`<div class="card lab-card"><h3>${m.title}</h3><p>${m.objectives[0]}</p><button class="secondary" data-module-result="${m.id}">Open lesson</button></div>`).join('')}</div>`:''}${labMatches.length?`<div class="section-title"><h3>Labs</h3></div><div class="grid lab-list">${labMatches.map(l=>`<div class="card lab-card"><h3>${l.title}</h3><p>${l.prompt}</p><button class="secondary" data-lab-result="${l.id}">Open lab</button></div>`).join('')}</div>`:''}${questionMatches.length?`<div class="section-title"><h3>Questions</h3></div><div class="question-bank">${questionMatches.slice(0,30).map((x,i)=>`<div class="qa"><button data-search-qa="${i}"><span>${x.question}</span><span>＋</span></button><div class="qa-answer"><strong>${x.answer}</strong><br>${x.explanation}</div></div>`).join('')}</div>`:''}${!moduleMatches.length&&!labMatches.length&&!questionMatches.length?'<div class="empty">No matches found.</div>':''}`;document.querySelectorAll('[data-module-result]').forEach(b=>b.onclick=()=>navigate({type:'module',id:b.dataset.moduleResult}));document.querySelectorAll('[data-lab-result]').forEach(b=>b.onclick=()=>navigate({type:'lab',id:b.dataset.labResult}));document.querySelectorAll('[data-search-qa]').forEach(b=>b.onclick=()=>b.closest('.qa').classList.toggle('open'))
}

buildNav();bindViewButtons();setTheme(state.theme);updateProgress();navigate({type:'dashboard'});
document.getElementById('themeBtn').onclick=()=>setTheme(state.theme==='dark'?'light':'dark');document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');let searchTimer;document.getElementById('globalSearch').oninput=e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>globalSearch(e.target.value),180)};document.addEventListener('click',e=>{const module=e.target.closest('[data-module]');if(module)navigate({type:'module',id:module.dataset.module});const view=e.target.closest('[data-view]');if(view&&!view.closest('#content'))navigate({type:view.dataset.view})});
</script>
</body>
</html>
