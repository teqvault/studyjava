<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>High Voltage Electrician Fundamentals · TeqStudy</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">⚡</div>
          <div class="logo-text">
            <span class="logo-title">HV Fundamentals</span>
            <span class="logo-sub">Apprentice Course</span>
          </div>
        </div>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">×</button>
      </div>

      <nav class="nav" id="nav">
        <div class="nav-section">
          <div class="nav-label">Course Modules</div>
          <button class="nav-item active" data-module="0">
            <span class="nav-num">01</span>
            <span class="nav-title">Safety Mindset</span>
            <span class="nav-check"></span>
          </button>
          <button class="nav-item" data-module="1">
            <span class="nav-num">02</span>
            <span class="nav-title">Electrical Theory</span>
            <span class="nav-check"></span>
          </button>
          <button class="nav-item" data-module="2">
            <span class="nav-num">03</span>
            <span class="nav-title">Transformers</span>
            <span class="nav-check"></span>
          </button>
          <button class="nav-item" data-module="3">
            <span class="nav-num">04</span>
            <span class="nav-title">HV Equipment</span>
            <span class="nav-check"></span>
          </button>
          <button class="nav-item" data-module="4">
            <span class="nav-num">05</span>
            <span class="nav-title">Grounding & Induced Voltage</span>
            <span class="nav-check"></span>
          </button>
          <button class="nav-item" data-module="5">
            <span class="nav-num">06</span>
            <span class="nav-title">Safe Work Practices</span>
            <span class="nav-check"></span>
          </button>
          <button class="nav-item" data-module="6">
            <span class="nav-num">07</span>
            <span class="nav-title">Testing Basics</span>
            <span class="nav-check"></span>
          </button>
          <button class="nav-item" data-module="7">
            <span class="nav-num">08</span>
            <span class="nav-title">Field Work</span>
            <span class="nav-check"></span>
          </button>
          <button class="nav-item" data-module="8">
            <span class="nav-num">09</span>
            <span class="nav-title">Professional Habits</span>
            <span class="nav-check"></span>
          </button>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="progress-box">
          <div class="progress-label">
            <span>Course Progress</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
        <button class="btn-reset" id="resetProgress">Reset Progress</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar-title" id="topbarTitle">Module 1 — Safety Mindset</div>
        <div class="topbar-actions">
          <button class="btn-theme" id="themeToggle" title="Toggle theme">◐</button>
        </div>
      </header>

      <div class="content" id="content">
        <!-- Modules will be injected here -->
      </div>

      <footer class="module-nav">
        <button class="btn-nav prev" id="prevBtn" disabled>← Previous</button>
        <button class="btn-complete" id="completeBtn">Mark Complete</button>
        <button class="btn-nav next" id="nextBtn">Next →</button>
      </footer>
    </main>
  </div>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
